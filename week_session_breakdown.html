<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week Session Breakdown</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --background-color: #ffffff;
      --text-color: #1A1A1B;
      --muted-text-color: #666666;
      --tooltip-bg: rgba(0, 0, 0, 0.85);
      --tooltip-text: #ffffff;
      
      /* Session Colors */
      --color-technique: #00897B;
      --color-threshold: #004448;
      --color-aerobic: #FFE9C3;
      --color-speed: #CFC4DB;
      --color-event: #E45F5D;
      --color-prep: #91BDCD;
    }

    :root.dark-mode {
      --background-color: transparent;
      --text-color: #ffffff;
      --muted-text-color: #91BDCD;
      --color-technique: #00897B; 
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background: var(--background-color);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 60px;
      width: 100vw;
    }

    #chart-container {
      width: 100%;
      height: 60px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: 0;
      box-sizing: border-box;
    }

    .session-segment {
      cursor: pointer;
      transition: opacity 0.2s;
    }

    #readout {
      margin-top: 5px;
      font-size: 15px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-align: left;
      width: 100%;
      line-height: 1.2;
      min-height: 1.2em;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--color-threshold);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }

    #error-message {
      color: var(--color-event);
      font-size: 12px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <div id="chart-container">
    <!-- SVG will be injected here -->
    <div id="readout"></div>
    <div id="error-message"></div>
  </div>

  <script>
    async function init() {
      const params = new URLSearchParams(window.location.search);
      const userId = params.get("userId");
      const token = params.get("token");
      const weekId = params.get("weekId"); // The 'id' field in your JSON weeks array
      const theme = params.get("theme") || "";

      if (theme.toLowerCase().includes("dark")) {
        document.documentElement.classList.add("dark-mode");
      }

      if (!userId || !token || !weekId) {
        showError("Missing parameters");
        return;
      }

      try {
        const data = await fetchForecast(userId, token);
        const week = data.weeks.find(w => String(w.id) === String(weekId));

        if (!week || !week.sessions || week.sessions.length === 0) {
          showError("No sessions found for this week");
          return;
        }

        renderChart(week.sessions);
      } catch (e) {
        showError(e.message);
      }
    }

    async function fetchForecast(userId, token) {
      const functionUrl = "https://kftdzpugxfrhddsymmol.supabase.co/functions/v1/get-user-plan-forecast";
      const headers = new Headers({ 
        "accept": "application/json",
        "content-type": "application/json",
        "Authorization": `Bearer ${token}`
      });

      const resp = await fetch(functionUrl, {
        method: "POST",
        headers,
        body: JSON.stringify({ userId })
      });

      if (!resp.ok) throw new Error("Failed to load data");
      
      const data = await resp.json();
      // The function returns the payload directly
      return data.weeks ? data : (data.payload || data);
    }

    function getColor(typeId) {
      // Map session_type IDs to colors
      switch(parseInt(typeId)) {
        case 1: return "var(--color-technique)";
        case 2: return "var(--color-threshold)";
        case 3: return "var(--color-aerobic)";
        case 4: return "var(--color-speed)";
        case 8: return "var(--color-event)"; // Race Day
        case 9: return "var(--color-prep)";  // Endurance Prep
        default: return "#CCCCCC";
      }
    }

    function renderChart(sessions) {
      const container = d3.select("#chart-container");
      const readout = d3.select("#readout");
      const totalDistance = sessions.reduce((sum, s) => sum + (s.target_distance || 0), 0);
      
      const width = document.getElementById("chart-container").clientWidth;
      const barHeight = 12; // Fixed thickness for the bar
      const gap = 1; 
      const availableWidth = width - (gap * (sessions.length - 1));

      const svg = container.insert("svg", "#readout")
        .attr("width", width)
        .attr("height", barHeight)
        .style("display", "block");

      // Create a clip path to round only the ends of the whole bar
      const clipId = "bar-clip-" + Math.floor(Math.random() * 1000000);
      svg.append("defs")
        .append("clipPath")
        .attr("id", clipId)
        .append("rect")
        .attr("x", 0)
        .attr("y", 0)
        .attr("width", width)
        .attr("height", barHeight)
        .attr("rx", barHeight / 2)
        .attr("ry", barHeight / 2);

      const barGroup = svg.append("g")
        .attr("clip-path", `url(#${clipId})`);
      
      let currentX = 0;

      function updateReadout(session) {
        const color = getColor(session.session_type);
        let name = session.session_type_name || "Training";
        
        // Custom readout for Race Day (type 8)
        if (parseInt(session.session_type) === 8) {
          const raceName = session.event_name || "Race Day";
          const dist = session.target_distance || session.event_distance || 0;
          name = `${raceName} (${dist}m)`;
        }
        
        readout.html(`<span class="dot" style="background-color: ${color}"></span>${name}`);
      }

      // Set initial readout
      if (sessions.length > 0) {
        updateReadout(sessions[0]);
      }

      barGroup.selectAll("rect")
        .data(sessions)
        .enter()
        .append("rect")
        .attr("class", "session-segment")
        .attr("x", d => {
          const x = currentX;
          const w = (d.target_distance / totalDistance) * availableWidth;
          currentX += w + gap;
          return x;
        })
        .attr("y", 0)
        .attr("width", d => (d.target_distance / totalDistance) * availableWidth)
        .attr("height", barHeight)
        .attr("fill", d => getColor(d.session_type))
        .on("mouseover", (event, d) => {
          updateReadout(d);
        });
    }

    function showError(msg) {
      const err = document.getElementById("error-message");
      err.style.display = "block";
      err.innerText = msg;
    }

    init();
  </script>
</body>
</html>
