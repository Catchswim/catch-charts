<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swim Intensity Timeline</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    :root {
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #004448;
    }

    body {
      margin: 0;
      padding: 1.5rem;
      background: transparent;
    }

    .chart-wrapper {
      max-width: 960px;
      margin: 0 auto;
    }

    #loading {
      margin-top: 1.5rem;
      padding: 1rem 1.5rem;
      border-radius: 0.75rem;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(0, 68, 72, 0.2);
      text-align: center;
      font-size: 0.95rem;
      color: #004448;
      letter-spacing: 0.02em;
    }

    .focus-readout {
      margin-top: 1rem;
      padding: 0.9rem 1.25rem;
      border-radius: 0.85rem;
      border: 1px solid rgba(0, 68, 72, 0.18);
      background: rgba(255, 255, 255, 0.75);
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      color: #004448;
      font-size: 0.85rem;
    }

    .focus-readout .label {
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.75;
      margin-bottom: 0.25rem;
    }

    .focus-readout .value {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .focus-readout.empty {
      justify-content: center;
      font-size: 0.9rem;
      font-weight: 500;
      opacity: 0.8;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 0.25rem;
    }

    p {
      margin-top: 0;
      color: #94a3b8;
      font-size: 0.95rem;
    }

    #chart {
      position: relative;
      margin-top: 1rem;
    }

    svg {
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .axis line,
    .axis path {
      stroke: #334155;
    }

    .axis text {
      fill: #cbd5f5;
      font-size: 0.8rem;
    }

    .line {
      fill: none;
      stroke-linecap: round;
      stroke-width: 3;
    }

    .hr-line {
      stroke: #ef4444;
    }

    .pace-line {
      stroke: #38bdf8;
      stroke-dasharray: 6 4;
    }

    .tooltip {
      position: absolute;
      padding: 0.65rem 0.85rem;
      border-radius: 0.55rem;
      background: rgba(2, 6, 23, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.4);
      pointer-events: none;
      font-size: 0.85rem;
      line-height: 1.4;
      display: none;
      box-shadow: 0 10px 40px rgba(2, 6, 23, 0.65);
    }

    .legend {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
      font-size: 0.85rem;
      color: #004448;
      flex-wrap: wrap;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      display: inline-block;
      margin-right: 0.35rem;
      vertical-align: middle;
    }

    .legend-dot.intensity-gradient {
      background: linear-gradient(90deg, #e0f2fe, #7dd3fc, #f87171, #b91c1c);
    }

    .work-block {
      opacity: 0.22;
    }

    .rest-block {
      fill: #CFC4DB;
      opacity: 0.45;
    }

    .interaction-overlay {
      fill: transparent;
      cursor: crosshair;
    }

    .focus-line {
      stroke: rgba(0, 68, 72, 0.35);
      stroke-width: 1.5px;
      stroke-dasharray: 4 3;
      display: none;
    }

    .focus-dot {
      r: 5;
      stroke: #fff;
      stroke-width: 2px;
      display: none;
    }

    .focus-dot.hr {
      fill: #f97316;
    }

    .focus-dot.pace {
      fill: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="chart-wrapper">
    <div id="chart"></div>
    <div class="legend">
      <span><span class="legend-dot" style="background:#ef4444"></span>Heart rate (bpm)</span>
      <span><span class="legend-dot" style="background:#38bdf8"></span>Pace (sec / 100 m)</span>
      <span><span class="legend-dot" style="background:#CFC4DB"></span>Rest periods</span>
      <span><span class="legend-dot intensity-gradient"></span>Swim intensity</span>
    </div>
  </div>
  <div id="focus-readout" class="focus-readout empty">Tap anywhere on the chart to inspect a moment.</div>
  <div class="tooltip" id="tooltip"></div>
  <div id="loading">Loading intensity timeline…</div>

  <script>
    const tooltip = d3.select("#tooltip");
    const readoutEl = document.getElementById("focus-readout");
    const width = 940;
    const height = 340;
    const margin = { top: 20, right: 60, bottom: 40, left: 60 };
    const loadingEl = document.getElementById("loading");
    const functionUrl = "https://kftdzpugxfrhddsymmol.supabase.co/functions/v1/swim-timeline";
    const intensityPalette = {
      easy: { label: "Easy", color: "#e0f2fe" },
      medium: { label: "Medium", color: "#7dd3fc" },
      fast: { label: "Fast", color: "#f87171" },
      max: { label: "Max", color: "#b91c1c" },
    };

    function setLoading(show) {
      if (!loadingEl) return;
      loadingEl.textContent = "Loading intensity timeline…";
      loadingEl.style.display = show ? "block" : "none";
    }

    function resetReadout(message = "Tap anywhere on the chart to inspect a moment.") {
      if (!readoutEl) return;
      readoutEl.classList.add("empty");
      readoutEl.textContent = message;
    }

    setLoading(true);
    resetReadout();

    async function fetchSession(sessionId, token) {
      const headers = new Headers({ accept: "application/json" });
      if (token) {
        headers.set("authorization", `Bearer ${token}`);
      }
      const resp = await fetch(`${functionUrl}?sessionId=${encodeURIComponent(sessionId)}`, {
        headers,
      });
      if (!resp.ok) {
        throw new Error(`Function returned ${resp.status}`);
      }
      const payload = await resp.json();
      if (!payload?.sessionData) {
        throw new Error("Session data missing");
      }
      return payload.sessionData;
    }

    function showError(message) {
      if (loadingEl) {
        loadingEl.textContent = message;
      }
      resetReadout(message);
      setLoading(true);
    }

    function parseSessionId() {
      const params = new URLSearchParams(window.location.search);
      return params.get("sessionId");
    }

    async function hydrateChart() {
      const sessionId = parseSessionId();
      if (!sessionId) {
        showError("Missing session id");
        return;
      }
      const token = parseToken();
      try {
        const payload = await fetchSession(sessionId, token);
        setLoading(false);
        renderChart(payload);
        if (token) {
          window.history.replaceState({}, "", window.location.pathname + window.location.search.replace(/&?token=[^&]*/, ""));
        }
      } catch (error) {
        console.error(error);
        showError("Unable to load swim data");
      }
    }

    function parseToken() {
      const params = new URLSearchParams(window.location.search);
      return params.get("token");
    }

    function renderChart(data) {
      resetReadout();

      const providerDetail = data.provider_workout_detail ?? null;
      const segments = [];
      let cumulative = 0;

      (data.segments ?? []).forEach((segment) => {
        const duration = Math.max(segment.rep_time_seconds ?? 0, 0);
        const startTime = cumulative;
        cumulative += duration;
        const distance = segment.rep_distance_meters ?? 0;
        const isRest = distance <= 0;
        segments.push({
          ...segment,
          startTime,
          endTime: startTime + duration,
          midTime: startTime + duration / 2,
          isRest,
          intensity: inferIntensity(segment.rep_description),
          label: `${segment.rep_description ?? "Segment"} · ${distance > 0 ? `${distance.toFixed(0)} m` : "rest"}`,
        });
      });

      const totalDuration = cumulative || data.summary?.total_duration || 0;
      const heartRateSeries = buildHeartRateSeries(providerDetail, segments, totalDuration);
      let hrSeries = heartRateSeries.length
        ? heartRateSeries
        : segments
            .filter((seg) => seg.rep_avg_hr != null)
            .map((seg) => ({
              time: seg.midTime,
              value: seg.rep_avg_hr,
            }));

      if (hrSeries.length) {
        const first = hrSeries[0];
        const last = hrSeries[hrSeries.length - 1];
        if (first.time > 0) {
          hrSeries = [{ time: 0, value: first.value }, ...hrSeries];
        }
        const sessionEnd = totalDuration || segments[segments.length - 1]?.endTime || last.time;
        if (sessionEnd && last.time < sessionEnd) {
          hrSeries = [...hrSeries, { time: sessionEnd, value: last.value }];
        }
      }

      const paceSeries = segments
        .filter((seg) => !seg.isRest && seg.rep_pace != null)
        .map((seg) => ({
          time: seg.midTime ?? seg.startTime,
          value: seg.rep_pace,
          label: seg.label,
          rep_avg_hr: seg.rep_avg_hr,
          duration: seg.endTime - seg.startTime,
          intensity: seg.intensity,
        }));

      const hrMaxTime = hrSeries.length ? d3.max(hrSeries, (d) => d.time) : 0;
      const domainMax = Math.max(totalDuration, hrMaxTime ?? 0);

      const paceExtent = d3.extent(paceSeries, (d) => d.value);
      const hrExtent = d3.extent(hrSeries, (d) => d.value);

      const paceScale = d3
        .scaleLinear()
        .domain([paceExtent[1] ?? 150, paceExtent[0] ?? 80])
        .range([height, 0])
        .nice();

      const hrScale = d3
        .scaleLinear()
        .domain([Math.min(hrExtent[0] ?? 110, 90), Math.max(hrExtent[1] ?? 160, 180)])
        .range([height, 0])
        .nice();

      const xScale = d3
        .scaleLinear()
        .domain([0, domainMax || totalDuration || 1])
        .range([0, width])
        .nice();

      const chart = d3.select("#chart");
      chart.selectAll("*").remove();

      const svg = chart
        .append("svg")
        .attr("viewBox", `0 0 ${width + margin.left + margin.right} ${height + margin.top + margin.bottom}`)
        .append("g")
        .attr("transform", `translate(${margin.left},${margin.top})`);

      svg
        .append("g")
        .attr("class", "axis x-axis")
        .attr("transform", `translate(0,${height})`)
        .call(
          d3
            .axisBottom(xScale)
            .ticks(8)
            .tickFormat((value) => formatTime(value))
        )
        .call((g) => g.select(".domain").attr("stroke", "#94a3b8"));

      svg
        .append("g")
        .attr("class", "axis y-axis")
        .call(d3.axisLeft(hrScale).ticks(6))
        .call((g) => g.select(".domain").attr("stroke", "#94a3b8"))
        .call((g) => g.selectAll("line").attr("stroke", "#1e293b"));

      svg
        .append("g")
        .attr("class", "axis y-axis secondary")
        .attr("transform", `translate(${width},0)`)
        .call(
          d3
            .axisRight(paceScale)
            .ticks(6)
            .tickFormat((value) => `${value.toFixed(0)} s / 100m`)
        )
        .call((g) => g.select(".domain").attr("stroke", "#94a3b8"))
        .call((g) => g.selectAll("line").attr("stroke", "#1e293b"));

      // Shade work intervals by inferred intensity.
      svg
        .selectAll(".work-block")
        .data(segments.filter((seg) => !seg.isRest))
        .enter()
        .append("rect")
        .attr("class", "work-block")
        .attr("x", (d) => xScale(d.startTime))
        .attr("y", 0)
        .attr("width", (d) => Math.max(xScale(d.endTime) - xScale(d.startTime), 1))
        .attr("height", height)
        .attr("fill", (d) => (intensityPalette[d.intensity] ?? intensityPalette.medium).color);

      svg
        .selectAll(".rest-block")
        .data(segments.filter((d) => d.isRest))
        .enter()
        .append("rect")
        .attr("class", "rest-block")
        .attr("x", (d) => xScale(d.startTime))
        .attr("y", 0)
        .attr("width", (d) => Math.max(xScale(d.endTime) - xScale(d.startTime), 1))
        .attr("height", height);

      const paceLine = d3
        .line()
        .defined((d) => d.value != null)
        .curve(d3.curveCatmullRom.alpha(0.5))
        .x((d) => xScale(d.time))
        .y((d) => paceScale(d.value));

      const hrLine = d3
        .line()
        .defined((d) => d.value != null)
        .curve(d3.curveCatmullRom.alpha(0.35))
        .x((d) => xScale(d.time))
        .y((d) => hrScale(d.value));

      svg
        .append("path")
        .datum(paceSeries)
        .attr("class", "line pace-line")
        .attr("d", paceLine);

      svg
        .append("path")
        .datum(hrSeries)
        .attr("class", "line hr-line")
        .attr("d", hrLine);

      svg
        .selectAll(".pace-point")
        .data(paceSeries)
        .enter()
        .append("circle")
        .attr("class", "pace-point")
        .attr("cx", (d) => xScale(d.time))
        .attr("cy", (d) => paceScale(d.value))
        .attr("r", 3.5)
        .attr("fill", "#38bdf8")
        .attr("stroke", "#0f172a")
        .attr("stroke-width", 1.2)
        .on("pointerenter", (event, datum) => {
          tooltip
            .style("display", "block")
            .html(`
              <strong>${datum.label}</strong><br/>
              Pace: ${formatPace(datum.value)}<br/>
              Avg HR: ${datum.rep_avg_hr ? datum.rep_avg_hr.toFixed(0) : "n/a"} bpm<br/>
              Duration: ${formatTime(datum.duration)}<br/>
              Intensity: ${(intensityPalette[datum.intensity] ?? intensityPalette.medium).label}
            `);
        })
        .on("pointermove", (event) => {
          tooltip
            .style("left", `${event.pageX + 12}px`)
            .style("top", `${event.pageY - 12}px`);
        })
        .on("pointerleave", () => tooltip.style("display", "none"));

      const focusGroup = svg.append("g").attr("class", "focus-group");
      const focusLine = focusGroup
        .append("line")
        .attr("class", "focus-line")
        .attr("y1", 0)
        .attr("y2", height);
      const focusHrDot = focusGroup.append("circle").attr("class", "focus-dot hr");
      const focusPaceDot = focusGroup.append("circle").attr("class", "focus-dot pace");

      const overlay = svg
        .append("rect")
        .attr("class", "interaction-overlay")
        .attr("width", width)
        .attr("height", height)
        .on("pointerdown", handleFocus)
        .on("pointermove", (event) => {
          if (event.buttons === 1 || event.pointerType === "touch") {
            handleFocus(event);
          }
        });

      function handleFocus(evt) {
        if (evt?.preventDefault) {
          evt.preventDefault();
        }
        const pointer = d3.pointer(evt, overlay.node());
        const clampedX = Math.max(0, Math.min(width, pointer[0] ?? 0));
        const time = xScale.invert(clampedX);
        const nearestHr = findNearestSample(hrSeries, time);
        const segment = segments.find((seg) => time >= seg.startTime && time <= seg.endTime);
        const paceValue = segment && !segment.isRest && segment.rep_pace != null ? segment.rep_pace : null;

        focusLine
          .attr("x1", clampedX)
          .attr("x2", clampedX)
          .style("display", "block");

        if (nearestHr) {
          focusHrDot
            .attr("cx", xScale(nearestHr.time))
            .attr("cy", hrScale(nearestHr.value))
            .style("display", "block");
        } else {
          focusHrDot.style("display", "none");
        }

        if (paceValue != null) {
          focusPaceDot
            .attr("cx", xScale(segment.midTime ?? segment.startTime))
            .attr("cy", paceScale(paceValue))
            .style("display", "block");
        } else {
          focusPaceDot.style("display", "none");
        }

        updateReadout({
          time,
          heartRate: nearestHr?.value ?? null,
          segment,
          pace: paceValue,
        });
      }

      svg
        .append("text")
        .attr("x", 0)
        .attr("y", -6)
        .attr("fill", "#004448")
        .attr("font-size", "0.9rem")
        .text(`Avg HR ${Number(data.summary?.avg_hr ?? 0).toFixed(1)} bpm · Avg pace ${Number(data.summary?.avg_pace ?? 0).toFixed(0)} s/100m`);
    }

    hydrateChart();

    function formatTime(value) {
      const safeValue = Number.isFinite(value) ? value : 0;
      const minutes = Math.floor(safeValue / 60);
      const seconds = Math.max(0, Math.round(safeValue % 60))
        .toString()
        .padStart(2, "0");
      return `${minutes}:${seconds}`;
    }

    function formatPace(value) {
      if (value == null || Number.isNaN(value)) {
        return "n/a";
      }
      return `${value.toFixed(1)} s / 100m`;
    }

    function inferIntensity(description = "") {
      const text = description.toLowerCase();
      if (text.includes("max") || text.includes("all out") || text.includes("sprint")) {
        return "max";
      }
      if (text.includes("fast") || text.includes("hard")) {
        return "fast";
      }
      if (text.includes("easy") || text.includes("warm") || text.includes("drill") || text.includes("technique")) {
        return "easy";
      }
      return "medium";
    }

    function buildHeartRateSeries(providerDetail, segments, sessionDuration) {
      if (!providerDetail) {
        return [];
      }

      if (providerDetail.heartRate?.samples?.length) {
        const samples = providerDetail.heartRate.samples;
        const reference =
          new Date(providerDetail.startDate || samples[0]?.timestamp || samples[0]?.startDate || Date.now()).getTime();
        return samples
          .filter((sample) => sample.value != null)
          .map((sample) => ({
            time: Math.max(
              0,
              (new Date(sample.timestamp || sample.startDate || sample.endTimestamp || reference).getTime() - reference) / 1000
            ),
            value: sample.value,
          }))
          .sort((a, b) => a.time - b.time);
      }

      if (Array.isArray(providerDetail.records)) {
        const timestampEntry = providerDetail.records.find((rec) => rec.timestamp || rec.startTime);
        const reference = timestampEntry ? new Date(timestampEntry.timestamp || timestampEntry.startTime).getTime() : null;
        if (!reference) {
          return [];
        }
        return providerDetail.records
          .filter((rec) => typeof rec.heartRate === "number")
          .map((rec) => ({
            time: Math.max(
              0,
              (new Date(rec.timestamp || rec.startTime).getTime() - reference) / 1000
            ),
            value: rec.heartRate,
          }))
          .sort((a, b) => a.time - b.time);
      }

      return [];
    }

    function findNearestSample(series, target) {
      if (!series.length) {
        return null;
      }
      let left = 0;
      let right = series.length - 1;
      while (left <= right) {
        const mid = Math.floor((left + right) / 2);
        if (series[mid].time < target) {
          left = mid + 1;
        } else {
          right = mid - 1;
        }
      }
      const candidates = [];
      if (left < series.length) {
        candidates.push(series[left]);
      }
      if (left - 1 >= 0) {
        candidates.push(series[left - 1]);
      }
      if (!candidates.length) {
        return series[0];
      }
      return candidates.reduce((closest, sample) => {
        return Math.abs(sample.time - target) < Math.abs(closest.time - target) ? sample : closest;
      });
    }

    function updateReadout({ time, heartRate, segment, pace }) {
      if (!readoutEl) {
        return;
      }
      readoutEl.classList.remove("empty");
      const intensityLabel = segment ? (intensityPalette[segment.intensity] ?? intensityPalette.medium).label : "—";
      const stateLabel = segment?.isRest ? "Rest" : pace != null ? formatPace(pace) : "—";
      const hrLabel = heartRate != null ? `${Math.round(heartRate)} bpm` : "—";
      const segmentLabel = segment?.rep_description ?? "—";
      readoutEl.innerHTML = `
        <div>
          <div class="label">Time</div>
          <div class="value">${formatTime(time)}</div>
        </div>
        <div>
          <div class="label">Heart rate</div>
          <div class="value">${hrLabel}</div>
        </div>
        <div>
          <div class="label">${segment?.isRest ? "Intensity" : "Pace"}</div>
          <div class="value">${stateLabel}</div>
        </div>
        <div>
          <div class="label">Rep</div>
          <div class="value">${segmentLabel}</div>
        </div>
        <div>
          <div class="label">Intensity</div>
          <div class="value">${intensityLabel}</div>
        </div>
      `;
    }
  </script>
</body>
</html>
