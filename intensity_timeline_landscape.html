<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Swim Intensity Timeline · Landscape</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap");

    :root {
      --background-color: #f6fdff;
      --body-background-color: #FFFFFF;
      --text-color: #004448;
      --muted-text-color: rgba(0, 68, 72, 0.75);
      --surface-color: #ffffff;
      --border-color: #CFC4DB;
      --tooltip-background: #ffffff;
      --tooltip-border: #CFC4DB;
      --focus-readout-background: #ffffff;
      --focus-readout-border: #CFC4DB;
      --focus-line-color: rgba(0, 68, 72, 0.7);
      --rest-block-color: #E5E5E5;
      --axis-text-color: #004448;
      --legend-color: #004448;
      font-family: "Poppins", "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text-color);
      background: var(--background-color);
      --landscape-height: calc(50vh - 35px);
    }

    :root.dark-mode {
      --background-color: #151820;
      --body-background-color: #151820;
      --text-color: #f6fdff;
      --muted-text-color: rgba(229, 251, 252, 0.75);
      --surface-color: #151820;
      --border-color: #CFC4DB;
      --tooltip-background: #151820;
      --tooltip-border: #CFC4DB;
      --focus-readout-background: #151820;
      --focus-readout-border: #CFC4DB;
      --focus-line-color: #CFC4DB;
      --rest-block-color: rgba(229, 229, 229, 0.35);
      --axis-text-color: #f6fdff;
      --legend-color: #f6fdff;
    }

    @supports (height: 50dvh) {
      :root {
        --landscape-height: calc(100dvh - 35px);
      }
    }

    @supports (height: 50svh) {
      :root {
        --landscape-height: min(calc(50svh - 35px), calc(100dvh - 35px));
      }
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: var(--landscape-height);
      height: var(--landscape-height);
      background: var(--background-color);
      color: var(--text-color);
      overflow: hidden;
      touch-action: pan-y;
    }

    body {
      display: flex;
      width: 100%;
      min-height: var(--landscape-height);
      height: var(--landscape-height);
      background: var(--body-background-color);
      align-items: center;
      justify-content: center;
    }

    .page-wrapper {
      position: relative;
      flex: 1;
      width: 100%;
      max-width: 1600px;
      margin: 0 auto;
      padding: 0;
      box-sizing: border-box;
      background: transparent;
      display: flex;
      flex-direction: column;
      min-height: var(--landscape-height);
      height: var(--landscape-height);
      justify-content: center;
    }

    .chart-wrapper {
      width: 100%;
      flex: 1;
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: 10px;
      padding: 10px;
      box-sizing: border-box;
      min-height: 0;
      height: 100%;
      max-height: none;
    }

    .chart-column {
      flex: 1 1 70%;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
      justify-content: center;
    }

    .chart-area {
      position: relative;
      flex: 1;
      min-height: 240px;
      border-radius: 14px;
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 5px 5px 2px 5px;
      box-sizing: border-box;
    }

    .chart-area-inner {
      position: relative;
      flex: 1;
      border-radius: 8px;
      overflow: hidden;
      touch-action: none;
    }

    #chart {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .axis line,
    .axis path {
      stroke: none;
    }

    .axis text {
      fill: var(--axis-text-color);
      font-size: 18px;
      font-family: inherit;
    }

    .line {
      fill: none;
      stroke-linecap: round;
      stroke-width: 3;
    }

    .hr-line {
      stroke: #E45F5D;
    }

    .tooltip {
      position: absolute;
      padding: 0.65rem 0.85rem;
      border-radius: 0.55rem;
      background: var(--tooltip-background);
      border: 1px solid var(--tooltip-border);
      pointer-events: none;
      font-size: 0.85rem;
      line-height: 1.4;
      display: none;
      box-shadow: 0 10px 30px rgba(0, 68, 72, 0.15);
      font-family: inherit;
      color: var(--text-color);
      z-index: 5;
    }

    .legend {
      display: flex;
      gap: 1.25rem;
      font-size: 12px;
      font-weight: 400;
      color: var(--legend-color);
      flex-wrap: wrap;
      margin: 5px;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      display: inline-block;
      margin-right: 0.35rem;
      vertical-align: middle;
    }

    .rest-block {
      fill: var(--rest-block-color);
      opacity: 0.2;
    }

    .interaction-overlay {
      fill: transparent;
      cursor: crosshair;
      touch-action: none;
    }

    .focus-line {
      stroke: var(--focus-line-color);
      stroke-width: 2.5px;
      stroke-dasharray: 4 3;
      display: none;
    }

    .focus-dot {
      r: 5;
      stroke: #fff;
      stroke-width: 2px;
      display: none;
    }

    .focus-dot.hr {
      fill: #E45F5D;
    }

    .focus-dot.pace {
      fill: #91BDCD;
    }

    .focus-handle {
      display: none;
      fill: var(--text-color);
      stroke: var(--surface-color);
      stroke-width: 2px;
      r: 6;
    }

    .focus-readout {
      flex: 0 0 auto;
      max-width: 28%;
      min-width: 100px;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--focus-readout-border);
      background: var(--focus-readout-background);
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 10px 14px;
      font-size: 12px;
      overflow-y: auto;
      align-self: stretch;
      box-sizing: border-box;
      min-height: 0;
      touch-action: pan-y;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      max-height: 100%;
    }

    .focus-readout > div {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 120px;
      max-width: calc(100% - 16px);
    }

    .focus-readout .label {
      font-size: 12px;
      font-weight: 400;
      color: var(--muted-text-color);
      margin-bottom: 0.15rem;
    }

    .focus-readout .value {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .focus-readout.empty {
      justify-content: center;
      font-size: 1rem;
      font-weight: 500;
      opacity: 0.85;
    }

    .layout-debug-panel {
      position: fixed;
      left: 12px;
      top: 12px;
      z-index: 9999;
      max-width: 320px;
      background: rgba(11, 30, 34, 0.92);
      color: #f6fdff;
      font-family: "Poppins", "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 12px;
      line-height: 1.3;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      pointer-events: none;
      opacity: 0.95;
      display: none;
      white-space: pre-wrap;
    }

    #loading {
      display: none;
    }

    .rotate-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(11, 30, 34, 0.92);
      color: #f6fdff;
      font-size: 1.2rem;
      font-weight: 500;
      text-align: center;
      padding: 24px;
      z-index: 20;
      pointer-events: none;
    }

    @media (orientation: portrait) {
      .rotate-overlay {
        display: flex;
      }
    }
  </style>
</head>
<body>
  <div class="rotate-overlay">Rotate your device for the optimal landscape view.</div>
  <div class="page-wrapper">
    <div class="chart-wrapper">
      <div class="chart-column">
        <div class="chart-area">
          <div class="chart-area-inner">
            <div id="chart"></div>
          </div>
          <div class="legend">
            <span><span class="legend-dot" style="background:#E45F5D"></span>Heart rate (bpm)</span>
            <span><span class="legend-dot" style="background:#91BDCD"></span>Pace (per 100 m)</span>
            <span><span class="legend-dot" style="background:var(--rest-block-color)"></span>Rest periods</span>
          </div>
        </div>
      </div>
      <div id="focus-readout" class="focus-readout empty">Tap anywhere to find out more.</div>
    </div>
    <div class="tooltip" id="tooltip"></div>
  </div>

  <script>
    const tooltip = d3.select("#tooltip");
    const readoutEl = document.getElementById("focus-readout");
    let width = 1400;
    let height = 720;
    const margin = { top: 8, right: 85, bottom: 8, left: 60 };
    const DURATION_ALIGNMENT_TOLERANCE = 0.02;
    const functionUrl = "https://kftdzpugxfrhddsymmol.supabase.co/functions/v1/swim-timeline";
    const urlParams = new URLSearchParams(window.location.search);
    const layoutDebugEnabled =
      urlParams.has("debugLayout") ||
      urlParams.get("debug") === "layout" ||
      urlParams.get("layoutLogs") === "1";
    let layoutDebugPanel = null;

    function logLayoutDebug(message, detail = {}) {
      if (!layoutDebugEnabled) {
        return;
      }
      try {
        console.log(`[timeline-layout] ${message}`, detail);
      } catch (_) {
        // ignore logging errors
      }
      updateLayoutDebugPanel(message, detail);
    }

    function ensureLayoutDebugPanel() {
      if (!layoutDebugEnabled) {
        return null;
      }
      if (layoutDebugPanel) {
        return layoutDebugPanel;
      }
      layoutDebugPanel = document.createElement("div");
      layoutDebugPanel.className = "layout-debug-panel";
      layoutDebugPanel.setAttribute("aria-live", "polite");
      layoutDebugPanel.style.display = "block";
      document.body?.appendChild(layoutDebugPanel);
      return layoutDebugPanel;
    }

    function stringifyLayoutDetail(detail = {}) {
      try {
        return JSON.stringify(detail, null, 2);
      } catch (_) {
        return String(detail);
      }
    }

    function updateLayoutDebugPanel(message, detail) {
      if (!layoutDebugEnabled) {
        return;
      }
      const panel = ensureLayoutDebugPanel();
      if (!panel) {
        return;
      }
      const timestamp = new Date().toLocaleTimeString();
      panel.innerHTML = `<strong style="display:block;margin-bottom:4px;">${message}</strong><div style="opacity:0.8;margin-bottom:6px;">${timestamp}</div><code style="font-size:11px;white-space:pre-wrap;">${stringifyLayoutDetail(detail)}</code>`;
    }
    const intensityPalette = {
      rest: { label: "Rest", color: "#E5E5E5" },
      easy: { label: "Easy", color: "#2563eb" },
      medium: { label: "Medium", color: "#facc15" },
      fast: { label: "Fast", color: "#22c55e" },
      max: { label: "Max", color: "#b91c1c" },
    };
    const BASE_LANDSCAPE_OFFSET_PX = 35;
    const ANDROID_WEBVIEW_HEADER_PX = 70;
    const isAndroidDevice = typeof navigator !== "undefined" && /Android/i.test(navigator.userAgent || "");
    const LANDSCAPE_OFFSET_PX = BASE_LANDSCAPE_OFFSET_PX + (isAndroidDevice ? ANDROID_WEBVIEW_HEADER_PX : 0);

    const themePreferenceParam = getThemeParam();
    const resolvedDarkMode = resolveDarkModePreference(themePreferenceParam);
    applyDocumentTheme(resolvedDarkMode);
    if (!themePreferenceParam) {
      attachSystemThemeListener();
    }

    let latestSessionData = null;
    let viewportHeightListenersAttached = false;
    let pendingViewportHeightFrame = null;
    let pendingViewportRenderFrame = null;
    let layoutOverflowCompensation = 0;

    function applyLandscapeViewportHeight() {
      const viewportHeight =
        window.visualViewport?.height ?? window.innerHeight ?? document.documentElement?.clientHeight ?? 720;
      const viewportOffsetTop = window.visualViewport?.offsetTop ?? 0;
      const computedHeight = Math.max(320, Math.round(viewportHeight - viewportOffsetTop - LANDSCAPE_OFFSET_PX));
      applyRootHeight(computedHeight);
      scheduleLatestDataRender();
    }

    function scheduleLandscapeViewportHeightUpdate() {
      if (pendingViewportHeightFrame != null) {
        return;
      }
      pendingViewportHeightFrame = window.requestAnimationFrame(() => {
        pendingViewportHeightFrame = null;
        applyLandscapeViewportHeight();
      });
    }

    function scheduleLatestDataRender() {
      if (!latestSessionData) {
        return;
      }
      if (pendingViewportRenderFrame != null) {
        return;
      }
      pendingViewportRenderFrame = window.requestAnimationFrame(() => {
        pendingViewportRenderFrame = null;
        renderChart(latestSessionData);
      });
    }

    function applyRootHeight(heightPx) {
      const safeHeight = Math.max(320, Math.round(heightPx ?? 320));
      const pxValue = `${safeHeight}px`;
      document.documentElement.style.setProperty("--landscape-height", pxValue);
      document.documentElement.style.height = pxValue;
      document.documentElement.style.minHeight = pxValue;
      if (document.body) {
        document.body.style.height = pxValue;
        document.body.style.minHeight = pxValue;
      }
      const pageWrapper = document.querySelector(".page-wrapper");
      if (pageWrapper) {
        pageWrapper.style.height = pxValue;
        pageWrapper.style.minHeight = pxValue;
      }
    }

    function clampLayoutToViewport(currentChartAreaHeight, chartWrapper) {
      const root = document.documentElement;
      const viewportHeight = window.visualViewport?.height ?? window.innerHeight ?? root?.clientHeight ?? 0;
      let overflow = 0;
      if (root) {
        overflow = Math.max(overflow, Math.round(root.scrollHeight - root.clientHeight));
      }
      if (chartWrapper && viewportHeight) {
        const wrapperRect = chartWrapper.getBoundingClientRect();
        if (wrapperRect) {
          const wrapperOverflow = Math.max(0, Math.round(wrapperRect.bottom - viewportHeight));
          overflow = Math.max(overflow, wrapperOverflow);
        }
      }
      if (overflow > 1 && currentChartAreaHeight > 240) {
        const maxAdjustable = Math.max(0, currentChartAreaHeight - 240);
        if (maxAdjustable <= 0) {
          logLayoutDebug("clamp skipped (no adjustable height)", {
            overflow,
            currentChartAreaHeight,
            maxAdjustable,
          });
          return false;
        }
        layoutOverflowCompensation = Math.min(
          maxAdjustable,
          Math.max(0, (layoutOverflowCompensation || 0) + overflow + 1)
        );
        logLayoutDebug("clamp applied", {
          overflow,
          currentChartAreaHeight,
          maxAdjustable,
          layoutOverflowCompensation,
        });
        return true;
      }
      layoutOverflowCompensation = 0;
      logLayoutDebug("clamp cleared", {
        overflow,
        currentChartAreaHeight,
      });
      return false;
    }

    function ensureViewportHeightListeners() {
      if (viewportHeightListenersAttached) {
        return;
      }
      viewportHeightListenersAttached = true;
      window.addEventListener("resize", scheduleLandscapeViewportHeightUpdate);
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", scheduleLandscapeViewportHeightUpdate);
      }
    }

    scheduleLandscapeViewportHeightUpdate();
    ensureViewportHeightListeners();

    async function tryLockOrientation() {
      if (window.screen?.orientation?.lock) {
        try {
          await window.screen.orientation.lock("landscape");
        } catch (_) {
          // Ignore failures gracefully; not supported everywhere.
        }
      }
    }

    window.addEventListener("load", () => {
      scheduleLandscapeViewportHeightUpdate();
      tryLockOrientation();
    });

    function resetReadout(message = "Tap anywhere to find out more.") {
      if (!readoutEl) return;
      readoutEl.classList.add("empty");
      readoutEl.textContent = message;
    }
    resetReadout();
    resetReadout();

    async function fetchSession(sessionId, token) {
      const headers = new Headers({ accept: "application/json" });
      if (token) {
        headers.set("authorization", `Bearer ${token}`);
      }
      const resp = await fetch(`${functionUrl}?sessionId=${encodeURIComponent(sessionId)}`, {
        headers,
      });
      if (!resp.ok) {
        throw new Error(`Function returned ${resp.status}`);
      }
      const payload = await resp.json();
      if (!payload?.sessionData) {
        throw new Error("Session data missing");
      }
      return payload.sessionData;
    }

    function parseSessionId() {
      const params = new URLSearchParams(window.location.search);
      return params.get("sessionId");
    }

    function parseToken() {
      const params = new URLSearchParams(window.location.search);
      return params.get("token");
    }

    function getThemeParam() {
      const params = new URLSearchParams(window.location.search);
      const candidate = params.get("theme") ?? params.get("mode") ?? params.get("appearance");
      if (!candidate) {
        return null;
      }
      const normalized = candidate.toLowerCase();
      if (normalized.includes("dark")) {
        return "dark";
      }
      if (normalized.includes("light")) {
        return "light";
      }
      return null;
    }

    function resolveDarkModePreference(themeParam) {
      if (themeParam === "dark") {
        return true;
      }
      if (themeParam === "light") {
        return false;
      }
      return window.matchMedia?.("(prefers-color-scheme: dark)")?.matches ?? false;
    }

    function applyDocumentTheme(isDark) {
      const root = document.documentElement;
      if (!root) {
        return;
      }
      root.classList.toggle("dark-mode", Boolean(isDark));
      if (document.body) {
        document.body.classList.toggle("dark-mode", Boolean(isDark));
      }
    }

    function attachSystemThemeListener() {
      const mediaQuery = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
      if (!mediaQuery) {
        return;
      }
      const updateTheme = (event) => applyDocumentTheme(event.matches);
      if (mediaQuery.addEventListener) {
        mediaQuery.addEventListener("change", updateTheme);
      } else if (mediaQuery.addListener) {
        mediaQuery.addListener(updateTheme);
      }
    }

    async function hydrateChart() {
      const sessionId = parseSessionId();
      if (!sessionId) {
        showError("Missing session id");
        return;
      }
      const token = parseToken();
      try {
        const payload = await fetchSession(sessionId, token);
        latestSessionData = payload;
        layoutOverflowCompensation = 0;
        renderChart(payload);
        if (!window.__timelineLandscapeResizeAttached) {
          window.__timelineLandscapeResizeAttached = true;
          window.addEventListener("resize", () => {
            if (!latestSessionData) return;
            window.requestAnimationFrame(() => renderChart(latestSessionData));
          });
        }
        if (token) {
          window.history.replaceState({}, "", window.location.pathname + window.location.search.replace(/&?token=[^&]*/, ""));
        }
      } catch (error) {
        console.error(error);
        resetReadout("Unable to load swim data");
      }
    }

    function renderChart(data, options = {}) {
      resetReadout();

      const chartContainer = document.getElementById("chart");
      const chartAreaInner = chartContainer?.parentElement;
      const chartAreaCard = chartAreaInner?.parentElement;
      const chartWrapper = document.querySelector(".chart-wrapper");
      const chartColumn = document.querySelector(".chart-column");
      const legendEl = document.querySelector(".legend");
      const focusReadoutEl = document.getElementById("focus-readout");

      const viewportWidth = window.innerWidth || document.documentElement.clientWidth || 1600;
      const viewportHeight = window.innerHeight || document.documentElement.clientHeight || 800;

      const wrapperClientHeight = chartWrapper?.clientHeight ?? viewportHeight * 0.9;
      const wrapperStyles = chartWrapper ? window.getComputedStyle(chartWrapper) : null;
      const wrapperPaddingTop = wrapperStyles ? parseFloat(wrapperStyles.paddingTop || "0") : 0;
      const wrapperPaddingBottom = wrapperStyles ? parseFloat(wrapperStyles.paddingBottom || "0") : 0;
      const innerWrapperHeight = Math.max(200, wrapperClientHeight - wrapperPaddingTop - wrapperPaddingBottom);
      const columnGap = chartColumn
        ? parseFloat(getComputedStyle(chartColumn).rowGap || getComputedStyle(chartColumn).gap || "0")
        : 0;
      const legendHeight = legendEl?.offsetHeight ?? 0;
      const reservedHeight = legendHeight + columnGap;
      let chartColumnHeight = innerWrapperHeight;
      const uncompensatedHeight = Math.max(240, chartColumnHeight);
      if (layoutOverflowCompensation > 0) {
        const maxAllowedReduction = Math.max(0, uncompensatedHeight - 240);
        chartColumnHeight -= Math.min(layoutOverflowCompensation, maxAllowedReduction);
      }
      chartColumnHeight = Math.max(240, chartColumnHeight);
      const targetInnerHeight = Math.max(0, chartColumnHeight - reservedHeight);
      const targetColumnHeight = targetInnerHeight + reservedHeight;

      logLayoutDebug("sizing computed", {
        viewportWidth,
        viewportHeight,
        wrapperClientHeight,
        innerWrapperHeight,
        columnGap,
        legendHeight,
        reservedHeight,
        chartColumnHeight,
        targetInnerHeight,
        targetColumnHeight,
        layoutOverflowCompensation,
      });
      if (chartAreaCard) {
        chartAreaCard.style.removeProperty("height");
        chartAreaCard.style.minHeight = `${targetColumnHeight}px`;
      }
      if (chartAreaInner) {
        const innerHeightPx = `${targetInnerHeight}px`;
        chartAreaInner.style.minHeight = innerHeightPx;
        chartAreaInner.style.height = innerHeightPx;
        chartAreaInner.style.maxHeight = innerHeightPx;
      }
      if (focusReadoutEl) {
        const applyReadoutHeight = (value) => {
          const safeHeight = Math.max(240, Math.min(value, innerWrapperHeight));
          focusReadoutEl.style.minHeight = `${safeHeight}px`;
          focusReadoutEl.style.height = `${safeHeight}px`;
          focusReadoutEl.style.maxHeight = `${safeHeight}px`;
        };
        applyReadoutHeight(targetColumnHeight);
        window.requestAnimationFrame(() => {
          const recalculatedHeight = chartColumn?.clientHeight ?? targetColumnHeight;
          applyReadoutHeight(recalculatedHeight);
          logLayoutDebug("readout height applied", {
            requestedHeight: targetColumnHeight,
            recalculatedHeight,
            columnClientHeight: chartColumn?.clientHeight ?? null,
          });
        });
      }

      const chartWidth = chartAreaInner?.clientWidth ?? Math.max(900, viewportWidth * 0.65);
      const chartInnerHeight = chartAreaInner?.clientHeight ?? targetInnerHeight;
      const availablePlotWidth = Math.max(600, chartWidth - margin.left - margin.right);

      width = availablePlotWidth;
      height = Math.max(200, chartInnerHeight - margin.top - margin.bottom);

      const providerDetail = data.provider_workout_detail ?? null;
      const sessionReferenceSeconds = getSessionReferenceSeconds(providerDetail);
      const segments = [];
      let cumulative = 0;

      (data.segments ?? []).forEach((segment) => {
        const duration = Math.max(segment.rep_time_seconds ?? 0, 0);
        const startTime = cumulative;
        cumulative += duration;
        const distance = segment.rep_distance_meters ?? 0;
        const isRest = distance <= 0;
        segments.push({
          ...segment,
          startTime,
          endTime: startTime + duration,
          midTime: startTime + duration / 2,
          isRest,
          intensity: inferIntensity(segment.rep_description, isRest),
          label: `${segment.rep_description ?? "Segment"} · ${distance > 0 ? `${distance.toFixed(0)} m` : "rest"}`,
        });
      });

      applyActualSegmentTimings(segments, providerDetail, sessionReferenceSeconds);

      let totalDuration = cumulative || data.summary?.total_duration || 0;
      const timelineEnd = segments[segments.length - 1]?.endTime;
      if (Number.isFinite(timelineEnd) && timelineEnd > 0) {
        totalDuration = timelineEnd;
      }

      const clipRange = [
        segments[0]?.startTime ?? 0,
        segments[segments.length - 1]?.endTime ?? totalDuration,
      ];

      const heartRateSeries = buildHeartRateSeries(providerDetail, segments, totalDuration, {
        referenceSeconds: sessionReferenceSeconds,
        clipRange,
      });
      let hrSeries = heartRateSeries.length
        ? heartRateSeries
        : segments
          .filter((seg) => seg.rep_avg_hr != null)
          .map((seg) => ({
            time: seg.midTime,
            value: seg.rep_avg_hr,
          }));

      if (hrSeries.length) {
        const lastBeforeAlignment = hrSeries[hrSeries.length - 1];
        const expectedDuration = segments.length
          ? totalDuration
          : Math.max(totalDuration, lastBeforeAlignment?.time ?? 0);
        const shouldRescale =
          segments.length > 0 &&
          expectedDuration > 0 &&
          (lastBeforeAlignment?.time ?? 0) > 0;
        if (shouldRescale) {
          const durationDelta = Math.abs((lastBeforeAlignment?.time ?? 0) - expectedDuration);
          const relativeDelta = durationDelta / Math.max(lastBeforeAlignment.time, expectedDuration);
          if (relativeDelta > DURATION_ALIGNMENT_TOLERANCE) {
            const scaleFactor = expectedDuration / lastBeforeAlignment.time;
            const hrCount = hrSeries.length;
            hrSeries = hrSeries.map((sample, idx) => ({
              ...sample,
              time: idx === hrCount - 1 ? expectedDuration : sample.time * scaleFactor,
            }));
          }
        }
        const latestPoint = hrSeries[hrSeries.length - 1];
        if (expectedDuration && latestPoint.time < expectedDuration) {
          hrSeries = [...hrSeries, { time: expectedDuration, value: latestPoint.value }];
        }
      }

      const paceSegments = segments.filter((seg) => !seg.isRest && seg.rep_pace != null);
      let paceSeries = paceSegments.map((seg) => ({
        time: seg.midTime ?? seg.startTime,
        value: seg.rep_pace,
        label: seg.label,
        rep_avg_hr: seg.rep_avg_hr,
        duration: seg.endTime - seg.startTime,
        intensity: seg.intensity,
      }));

      if (paceSeries.length) {
        paceSeries = paceSeries.sort((a, b) => a.time - b.time);
        const paceFirst = paceSeries[0];
        const paceLast = paceSeries[paceSeries.length - 1];
        if (paceFirst.time > 0) {
          paceSeries = [{ ...paceFirst, time: 0 }, ...paceSeries];
        }
        const sessionEnd = totalDuration || segments[segments.length - 1]?.endTime || paceLast.time;
        if (sessionEnd && paceLast.time < sessionEnd) {
          paceSeries = [
            ...paceSeries,
            {
              ...paceLast,
              time: sessionEnd,
            },
          ];
        }
      }

      const hrMaxTime = hrSeries.length ? d3.max(hrSeries, (d) => d.time) : 0;
      const domainMax = Math.max(totalDuration, hrMaxTime ?? 0);

      const paceExtent = d3.extent(paceSeries, (d) => d.value);
      const pacePadding = 12;
      const hrExtent = d3.extent(hrSeries, (d) => d.value);
      const hrPadding = 12;

      const paceScale = d3
        .scaleLinear()
        .domain([
          (paceExtent[1] ?? 150) + pacePadding,
          Math.max(0, (paceExtent[0] ?? 80) - pacePadding),
        ])
        .range([height, 0])
        .nice();

      const hrScale = d3
        .scaleLinear()
        .domain([
          Math.min(hrExtent[0] ?? 110, 90) - hrPadding,
          Math.max(hrExtent[1] ?? 160, 180) + hrPadding,
        ])
        .range([height, 0])
        .nice();

      const xScale = d3
        .scaleLinear()
        .domain([0, domainMax || totalDuration || 1])
        .range([0, width])
        .nice();
      const baseXScale = xScale.copy();
      let currentXScale = baseXScale;

      const chart = d3.select("#chart");
      chart.selectAll("*").remove();

      const rootSvg = chart
        .append("svg")
        .attr("width", width + margin.left + margin.right)
        .attr("height", height + margin.top + margin.bottom)
        .attr("viewBox", `0 0 ${width + margin.left + margin.right} ${height + margin.top + margin.bottom}`)
        .style("width", "100%")
        .style("height", "100%");

      const clipId = `plot-clip-${Math.random().toString(36).slice(2)}`;
      rootSvg
        .append("defs")
        .append("clipPath")
        .attr("id", clipId)
        .attr("clipPathUnits", "userSpaceOnUse")
        .append("rect")
        .attr("x", 0)
        .attr("y", 0)
        .attr("width", width)
        .attr("height", height);

      const svg = rootSvg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);
      const plotGroup = rootSvg
        .append("g")
        .attr("class", "plot-area")
        .attr("transform", `translate(${margin.left},${margin.top})`)
        .attr("clip-path", `url(#${clipId})`);

      const xAxis = svg
        .append("g")
        .attr("class", "axis x-axis")
        .attr("transform", `translate(0,${height})`)
        .call(
          d3
            .axisBottom(currentXScale)
            .ticks(Math.min(6, Math.ceil(totalDuration / 160)))
            .tickFormat((value) => formatTime(value))
        )
        .call((g) => {
          g.select(".domain").attr("stroke", "none");
          g.selectAll("line").attr("stroke", "none");
        });

      svg
        .append("g")
        .attr("class", "axis y-axis")
        .call(d3.axisLeft(hrScale).ticks(6))
        .call((g) => {
          g.select(".domain").attr("stroke", "none");
          g.selectAll("line").attr("stroke", "none");
        });

      svg
        .append("g")
        .attr("class", "axis y-axis secondary")
        .attr("transform", `translate(${width},0)`)
        .call(
          d3
            .axisRight(paceScale)
            .ticks(5)
            .tickFormat((value) => formatPace(value, false))
        )
        .call((g) => {
          g.select(".domain").attr("stroke", "none");
          g.selectAll("line").attr("stroke", "none");
        });

      const restBlocks = plotGroup
        .selectAll(".rest-block")
        .data(segments.filter((d) => d.isRest))
        .enter()
        .append("rect")
        .attr("class", "rest-block")
        .attr("x", (d) => currentXScale(d.startTime))
        .attr("y", 0)
        .attr("width", (d) => Math.max(currentXScale(d.endTime) - currentXScale(d.startTime), 1))
        .attr("height", height)
        .attr("opacity", 0.2);

      const paceBars = plotGroup
        .selectAll(".pace-bar")
        .data(paceSegments)
        .enter()
        .append("rect")
        .attr("class", "pace-bar")
        .attr("x", (d) => {
          const xStart = currentXScale(d.startTime);
          return isNaN(xStart) ? 0 : xStart;
        })
        .attr("y", (d) => paceScale(d.rep_pace))
        .attr("width", (d) => {
          const xStart = currentXScale(d.startTime);
          const xEnd = currentXScale(d.endTime);
          const barWidth = xEnd - xStart;
          return isNaN(barWidth) || barWidth <= 0 ? 1 : barWidth;
        })
        .attr("height", (d) => height - paceScale(d.rep_pace))
        .attr("fill", "#91BDCD")
        .attr("opacity", 0.8);

      const hrPath = plotGroup
        .append("path")
        .datum(hrSeries)
        .attr("class", "line hr-line")
        .attr(
          "d",
          d3
            .line()
            .defined((d) => d.value != null)
            .curve(d3.curveCatmullRom.alpha(0.35))
            .x((d) => currentXScale(d.time))
            .y((d) => hrScale(d.value))(hrSeries)
        );

      // Removed pace point markers per latest requirements

      const focusGroup = plotGroup.append("g").attr("class", "focus-group");
      const focusLine = focusGroup
        .append("line")
        .attr("class", "focus-line")
        .attr("y1", 0)
        .attr("y2", height);
      const focusHrDot = focusGroup.append("circle").attr("class", "focus-dot hr");
      const focusHandle = focusGroup
        .append("circle")
        .attr("class", "focus-handle")
        .attr("cy", -8);

      let activePointerId = null;
      let lastFocusTime = null;
      const activeTouchIds = new Set();
      let multiTouchActive = false;

      const overlay = plotGroup
        .append("rect")
        .attr("class", "interaction-overlay")
        .attr("width", width)
        .attr("height", height);
      overlay.style("pointer-events", "all").style("touch-action", "none");

      const supportsPointerEvents = window.PointerEvent != null;

      if (supportsPointerEvents) {
        overlay
          .on("pointerdown.focus", (event) => {
            const node = overlay.node();
            if (event.pointerType === "touch") {
              activeTouchIds.add(event.pointerId);
              multiTouchActive = activeTouchIds.size > 1;
              if (multiTouchActive) {
                if (node && node.releasePointerCapture) {
                  node.releasePointerCapture(event.pointerId);
                }
                activePointerId = null;
                return;
              }
            }
            activePointerId = event.pointerId;
            if (node && node.setPointerCapture && event.pointerType !== "touch") {
              node.setPointerCapture(activePointerId);
            }
            handleFocus(event);
          })
          .on("pointermove.focus", (event) => {
            const isTouch = event.pointerType === "touch";
            const isActiveDrag = (event.buttons & 1) === 1 || isTouch;
            if (isTouch) {
              if (!activeTouchIds.has(event.pointerId) || multiTouchActive) {
                return;
              }
            }
            if (event.pointerId === activePointerId && isActiveDrag) {
              handleFocus(event);
            }
          })
          .on("pointerup.focus pointercancel.focus pointerleave.focus", (event) => {
            if (event.pointerType === "touch") {
              activeTouchIds.delete(event.pointerId);
              multiTouchActive = activeTouchIds.size > 1;
            }
            if (event.pointerId === activePointerId) {
              const node = overlay.node();
              if (node && node.releasePointerCapture && event.pointerType !== "touch") {
                node.releasePointerCapture(activePointerId);
              }
              activePointerId = null;
            }
          });
      } else {
        overlay
          .on("touchstart.focus", (event) => {
            if (event.touches && event.touches.length > 1) {
              multiTouchActive = true;
              activePointerId = null;
              return;
            }
            multiTouchActive = false;
            activePointerId = "touch";
            handleFocus(event);
          })
          .on("touchmove.focus", (event) => {
            if (multiTouchActive || activePointerId !== "touch") {
              return;
            }
            handleFocus(event);
          })
          .on("touchend.focus touchcancel.focus", () => {
            activePointerId = null;
            multiTouchActive = false;
          })
          .on("mousedown.focus", (event) => {
            activePointerId = "mouse";
            handleFocus(event);
          })
          .on("mousemove.focus", (event) => {
            const isActiveDrag = event.buttons == null ? event.which === 1 : (event.buttons & 1) === 1;
            if (activePointerId !== "mouse" || !isActiveDrag) {
              return;
            }
            handleFocus(event);
          })
          .on("mouseup.focus mouseleave.focus", () => {
            if (activePointerId === "mouse") {
              activePointerId = null;
            }
          });
      }

      let focusUpdateFrame = null;
      let pendingFocusState = null;
      let currentTransform = d3.zoomIdentity;
      const overlayNode = overlay.node();
      const zoom = d3
        .zoom()
        .filter((event) => event.target === overlayNode)
        .scaleExtent([1, 14])
        .translateExtent([
          [0, 0],
          [width, height],
        ])
        .extent([
          [0, 0],
          [width, height],
        ])
        .constrain((transform) => {
          const k = Math.max(1, Math.min(14, transform.k));
          const minTranslateX = width * (1 - k);
          const clampedX = Math.min(0, Math.max(minTranslateX, transform.x));
          return d3.zoomIdentity.translate(clampedX, 0).scale(k);
        })
        .on("zoom", (event) => {
          currentTransform = event.transform;
          applyXScale(currentTransform.rescaleX(baseXScale));
        });

      overlay.call(zoom).on("dblclick.zoom", null).on("wheel.zoom", null);

      function handleFocus(evt, explicitTime = null) {
        if (!overlay?.node()) {
          return;
        }
        if (evt && typeof evt.type === "string" && evt.type.startsWith("touch")) {
          evt.preventDefault();
        }
        let rawX = null;
        if (explicitTime != null) {
          rawX = currentXScale(explicitTime);
        } else if (evt) {
          const pointer = d3.pointer(evt, overlay.node());
          rawX = pointer ? pointer[0] : 0;
        } else {
          rawX = 0;
        }
        const clampedX = Math.max(0, Math.min(width, rawX ?? 0));
        const time = explicitTime != null ? explicitTime : currentXScale.invert(clampedX);
        pendingFocusState = { clampedX, time };
        if (focusUpdateFrame == null) {
          focusUpdateFrame = window.requestAnimationFrame(() => {
            focusUpdateFrame = null;
            if (!pendingFocusState) {
              return;
            }
            applyFocusState(pendingFocusState);
            pendingFocusState = null;
          });
        }
      }

      function applyFocusState({ clampedX, time }) {
        const nearestHr = findNearestSample(hrSeries, time);
        const segment = segments.find((seg) => time >= seg.startTime && time <= seg.endTime);
        const nearestPace = paceSeries.length ? findNearestSample(paceSeries, time) : null;
        const paceValue = nearestPace?.value ?? null;

        focusLine.attr("x1", clampedX).attr("x2", clampedX).style("display", "block");
        focusHandle.attr("cx", clampedX).style("display", "block");

        if (nearestHr) {
          focusHrDot
            .attr("cx", currentXScale(nearestHr.time))
            .attr("cy", hrScale(nearestHr.value))
            .style("display", "block");
        } else {
          focusHrDot.style("display", "none");
        }

        // Pace focus dot removed

        lastFocusTime = time;
        updateReadout({
          time,
          heartRate: nearestHr?.value ?? null,
          segment,
          pace: paceValue,
        });
      }

      function applyXScale(scale) {
        currentXScale = scale;
        xAxis
          .call(
            d3
              .axisBottom(currentXScale)
              .ticks(Math.min(6, Math.ceil(totalDuration / 160)))
              .tickFormat((value) => formatTime(value))
          )
          .call((g) => {
            g.select(".domain").attr("stroke", "none");
            g.selectAll("line").attr("stroke", "none");
          });

        restBlocks
          .attr("x", (d) => currentXScale(d.startTime))
          .attr("width", (d) => Math.max(currentXScale(d.endTime) - currentXScale(d.startTime), 1));

        paceBars
          .attr("x", (d) => {
            const xStart = currentXScale(d.startTime);
            return isNaN(xStart) ? 0 : xStart;
          })
          .attr("width", (d) => {
            const xStart = currentXScale(d.startTime);
            const xEnd = currentXScale(d.endTime);
            const barWidth = xEnd - xStart;
            return isNaN(barWidth) || barWidth <= 0 ? 1 : barWidth;
          });

        hrPath.attr(
          "d",
          d3
            .line()
            .defined((d) => d.value != null)
            .curve(d3.curveCatmullRom.alpha(0.35))
            .x((d) => currentXScale(d.time))
            .y((d) => hrScale(d.value))(hrSeries)
        );

        if (lastFocusTime != null) {
          handleFocus(null, lastFocusTime);
        }
      }

      const defaultFocusTime = domainMax ? domainMax / 2 : segments[0]?.midTime ?? 0;
      handleFocus(null, defaultFocusTime);

    if (!options.suppressClamp && clampLayoutToViewport(chartColumnHeight, chartWrapper)) {
        window.requestAnimationFrame(() => {
          if (latestSessionData) {
            renderChart(latestSessionData, { suppressClamp: true });
          }
        });
      }
    }

    hydrateChart();

    function formatTime(value) {
      const safeValue = Number.isFinite(value) ? value : 0;
      const minutes = Math.floor(safeValue / 60);
      const seconds = Math.max(0, Math.round(safeValue % 60))
        .toString()
        .padStart(2, "0");
      return `${minutes}:${seconds}`;
    }

    function formatPace(value, includeUnit = true) {
      if (value == null || Number.isNaN(value)) {
        return "n/a";
      }
      const seconds = Math.max(0, value);
      const minutesPart = Math.floor(seconds / 60);
      const secondsPart = Math.round(seconds % 60)
        .toString()
        .padStart(2, "0");
      const formatted = `${minutesPart}m ${secondsPart}s`;
      return includeUnit ? `${formatted} / 100m` : formatted;
    }

    function inferIntensity(description = "", isRest = false) {
      if (isRest) {
        return "rest";
      }
      const text = description.toLowerCase();
      if (text.includes("warm") || text.includes("cool") || text.includes("easy") || text.includes("technique") || text.includes("drill")) {
        return "easy";
      }
      if (text.includes("max") || text.includes("all out") || text.includes("sprint")) {
        return "max";
      }
      if (text.includes("fast") || text.includes("hard")) {
        return "fast";
      }
      return "medium";
    }

    function buildHeartRateSeries(providerDetail, segments, sessionDuration, options = {}) {
      if (!providerDetail) {
        return [];
      }
      const { samples, referenceSeconds } = extractHeartRateSamples(providerDetail);
      if (!samples.length) {
        return [];
      }
      const referenceOverride = Number.isFinite(options.referenceSeconds) ? options.referenceSeconds : referenceSeconds;
      const clipRange = Array.isArray(options.clipRange) ? options.clipRange : null;
      return projectHeartRateSamples(samples, referenceOverride, clipRange);
    }

    function findNearestSample(series, target) {
      if (!series.length) {
        return null;
      }
      let left = 0;
      let right = series.length - 1;
      while (left <= right) {
        const mid = Math.floor((left + right) / 2);
        if (series[mid].time < target) {
          left = mid + 1;
        } else {
          right = mid - 1;
        }
      }
      const candidates = [];
      if (left < series.length) {
        candidates.push(series[left]);
      }
      if (left - 1 >= 0) {
        candidates.push(series[left - 1]);
      }
      if (!candidates.length) {
        return series[0];
      }
      return candidates.reduce((closest, sample) => {
        return Math.abs(sample.time - target) < Math.abs(closest.time - target) ? sample : closest;
      });
    }

    function updateReadout({ time, heartRate, segment, pace }) {
      if (!readoutEl) {
        return;
      }
      readoutEl.classList.remove("empty");
      const intensityLabel = segment
        ? (intensityPalette[segment.intensity] ?? intensityPalette.medium).label
        : "—";
      const stateLabel = segment?.isRest ? intensityLabel : pace != null ? formatPace(pace) : "—";
      const hrLabel = heartRate != null ? `${Math.round(heartRate)} bpm` : "—";
      const segmentLabel = segment?.rep_description ?? "—";
      const items = [
        {
          label: "Rep",
          value: segmentLabel,
        },
        {
          label: "Distance",
          value: segment?.rep_distance_meters != null ? `${segment.rep_distance_meters.toFixed(0)} m` : "—",
        },
        !segment?.isRest
          ? {
              label: "Pace",
              value: stateLabel,
            }
          : null,
        {
          label: "Heart rate",
          value: hrLabel,
        },
        {
          label: "Time",
          value: formatTime(time),
        },
      ].filter(Boolean);

      readoutEl.innerHTML = items
        .map(
          (item) => `
        <div>
          <div class="label">${item.label}</div>
          <div class="value">${item.value}</div>
        </div>
      `
        )
        .join("");
    }

    function extractHeartRateSamples(providerDetail) {
      if (!providerDetail) {
        return { samples: [], referenceSeconds: null };
      }
      const bridgeSamples = providerDetail.bridgeDetail?.heartRate?.samples;
      if (Array.isArray(bridgeSamples) && bridgeSamples.length) {
        return normalizeHeartRateSamples(
          bridgeSamples,
          providerDetail.bridgeDetail?.startDate ||
            providerDetail.startDate ||
            bridgeSamples[0]?.timestamp ||
            bridgeSamples[0]?.startDate ||
            bridgeSamples[0]?.endTimestamp,
          (sample) => sample.value
        );
      }

      const directSamples = providerDetail.heartRate?.samples;
      if (Array.isArray(directSamples) && directSamples.length) {
        return normalizeHeartRateSamples(
          directSamples,
          providerDetail.startDate || directSamples[0]?.timestamp || directSamples[0]?.startDate,
          (sample) => sample.value
        );
      }

      if (Array.isArray(providerDetail.records)) {
        const referenceCandidate =
          providerDetail.startDate ||
          providerDetail.records.find((rec) => rec?.timestamp || rec?.startTime)?.timestamp ||
          providerDetail.records.find((rec) => rec?.timestamp || rec?.startTime)?.startTime;
        return normalizeHeartRateSamples(
          providerDetail.records,
          referenceCandidate,
          (sample) => sample.heartRate,
          ["timestamp", "startTime"]
        );
      }

      return { samples: [], referenceSeconds: null };
    }

    function normalizeHeartRateSamples(rawSamples, fallbackReference, valueAccessor, timeFieldOrder = ["timestamp", "startDate", "startTime", "endTimestamp"]) {
      if (!Array.isArray(rawSamples) || !rawSamples.length || typeof valueAccessor !== "function") {
        return { samples: [], referenceSeconds: parseEventTimestamp(fallbackReference) ?? null };
      }
      const normalized = rawSamples
        .map((sample) => {
          const value = valueAccessor(sample);
          if (value == null || Number.isNaN(value)) {
            return null;
          }
          const fieldName = timeFieldOrder.find((field) => sample?.[field] != null);
          const epochSeconds = parseEventTimestamp(fieldName ? sample[fieldName] : null);
          if (epochSeconds == null) {
            return null;
          }
          return { epochSeconds, value };
        })
        .filter(Boolean)
        .sort((a, b) => a.epochSeconds - b.epochSeconds);
      const referenceSeconds = parseEventTimestamp(fallbackReference) ?? normalized[0]?.epochSeconds ?? null;
      return { samples: normalized, referenceSeconds };
    }

    function projectHeartRateSamples(samples, referenceSeconds, clipRange) {
      if (!samples.length) {
        return [];
      }
      const baseline = Number.isFinite(referenceSeconds) ? referenceSeconds : samples[0].epochSeconds;
      const [clipStart, clipEnd] = Array.isArray(clipRange) ? clipRange : [null, null];
      const epsilon = 0.0001;
      return samples
        .map((sample) => ({
          time: Math.max(0, sample.epochSeconds - baseline),
          value: sample.value,
        }))
        .filter((sample) => {
          const withinStart = clipStart == null || sample.time + epsilon >= clipStart;
          const withinEnd = clipEnd == null || sample.time - epsilon <= clipEnd;
          return withinStart && withinEnd;
        });
    }

    function applyActualSegmentTimings(segments, providerDetail, referenceSeconds) {
      if (!Array.isArray(segments) || !segments.length) {
        return;
      }
      const activities = providerDetail?.workoutActivities;
      if (!Array.isArray(activities) || !activities.length) {
        return;
      }
      const baseline = Number.isFinite(referenceSeconds) ? referenceSeconds : getSessionReferenceSeconds(providerDetail);
      if (!Number.isFinite(baseline)) {
        return;
      }
      segments.forEach((segment, index) => {
        const activity = activities[index];
        if (!activity) {
          return;
        }
        const startEpoch = parseEventTimestamp(activity.start);
        const endEpoch = parseEventTimestamp(activity.end);
        if (!Number.isFinite(startEpoch) || !Number.isFinite(endEpoch)) {
          return;
        }
        const startTime = convertTimestampToElapsedSeconds(startEpoch, baseline);
        const endTime = convertTimestampToElapsedSeconds(endEpoch, baseline);
        if (!Number.isFinite(startTime) || !Number.isFinite(endTime) || endTime < startTime) {
          return;
        }
        segment.startTime = startTime;
        segment.endTime = endTime;
        segment.midTime = startTime + (endTime - startTime) / 2;
      });
    }

    function convertTimestampToElapsedSeconds(timestampSeconds, baselineSeconds) {
      if (!Number.isFinite(timestampSeconds) || !Number.isFinite(baselineSeconds)) {
        return null;
      }
      return Math.max(0, timestampSeconds - baselineSeconds);
    }

    function getSessionReferenceSeconds(providerDetail) {
      if (!providerDetail) {
        return null;
      }
      return (
        parseEventTimestamp(providerDetail.startDate) ||
        parseEventTimestamp(providerDetail.bridgeDetail?.startDate) ||
        parseEventTimestamp(providerDetail.workoutActivities?.[0]?.start) ||
        null
      );
    }

    function parseEventTimestamp(value) {
      if (value == null) {
        return null;
      }
      if (typeof value === "number" && Number.isFinite(value)) {
        return value > 1e12 ? value / 1000 : value;
      }
      if (typeof value === "string") {
        const parsed = Date.parse(value);
        if (Number.isFinite(parsed)) {
          return parsed / 1000;
        }
      }
      return null;
    }
  </script>
