<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swim Intensity Timeline</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    :root {
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #004448;
    }

    body {
      margin: 0;
      padding: 1.5rem;
      background: transparent;
    }

    .chart-wrapper {
      max-width: 960px;
      margin: 0 auto;
    }

    #loading {
      margin-top: 1.5rem;
      padding: 1rem 1.5rem;
      border-radius: 0.75rem;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(0, 68, 72, 0.2);
      text-align: center;
      font-size: 0.95rem;
      color: #004448;
      letter-spacing: 0.02em;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 0.25rem;
    }

    p {
      margin-top: 0;
      color: #94a3b8;
      font-size: 0.95rem;
    }

    #chart {
      position: relative;
      margin-top: 1rem;
    }

    svg {
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .axis line,
    .axis path {
      stroke: #334155;
    }

    .axis text {
      fill: #cbd5f5;
      font-size: 0.8rem;
    }

    .line {
      fill: none;
      stroke-linecap: round;
      stroke-width: 3;
    }

    .hr-line {
      stroke: #f97316;
    }

    .pace-line {
      stroke: #38bdf8;
      stroke-dasharray: 6 4;
    }

    .rest-block {
      fill: #CFC4DB;
      opacity: 0.3;
    }

    .tooltip {
      position: absolute;
      padding: 0.65rem 0.85rem;
      border-radius: 0.55rem;
      background: rgba(2, 6, 23, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.4);
      pointer-events: none;
      font-size: 0.85rem;
      line-height: 1.4;
      display: none;
      box-shadow: 0 10px 40px rgba(2, 6, 23, 0.65);
    }

    .legend {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
      font-size: 0.85rem;
      color: #004448;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      display: inline-block;
      margin-right: 0.35rem;
      vertical-align: middle;
    }
  </style>
</head>

const tooltip = d3.select("#tooltip");
const width = 940;
const height = 340;
const margin = { top: 20, right: 60, bottom: 40, left: 60 };
const loadingEl = document.getElementById("loading");

function setLoading(show) {
  if (!loadingEl) return;
  loadingEl.style.display = show ? "block" : "none";
}

setLoading(true);

function renderChart(data) {
  const segments = [];
  let cumulative = 0;
  data.segments.forEach((segment) => {
    const startTime = cumulative;
    const duration = Math.max(segment.rep_time_seconds ?? 0, 0);
    cumulative += duration;
    segments.push({
      ...segment,
      startTime,
      endTime: startTime + duration,
      label: `${segment.rep_description} · ${segment.rep_distance_meters > 0 ? `${segment.rep_distance_meters.toFixed(0)} m` : "rest"}`
    });
  });

  const totalTime = cumulative || data.summary.total_duration;

  const pacePoints = segments.filter((d) => d.rep_pace != null && d.rep_distance_meters > 0);
  const hrPoints = segments.filter((d) => d.rep_avg_hr != null);

  const paceExtent = d3.extent(pacePoints, (d) => d.rep_pace);
  const hrExtent = d3.extent(hrPoints, (d) => d.rep_avg_hr);

  const paceScale = d3
    .scaleLinear()
    .domain([paceExtent[1] ?? 150, paceExtent[0] ?? 80])
    .range([height, 0])
    .nice();

  const hrScale = d3
    .scaleLinear()
    .domain([Math.min(hrExtent[0] ?? 110, 110), Math.max(hrExtent[1] ?? 160, 160)])
    .range([height, 0])
    .nice();

  const xScale = d3.scaleLinear().domain([0, totalTime]).range([0, width]).nice();

  const chart = d3.select("#chart");
  chart.selectAll("*").remove();

  const svg = chart
    .append("svg")
    .attr("viewBox", `0 0 ${width + margin.left + margin.right} ${height + margin.top + margin.bottom}`)
    .append("g")
    .attr("transform", `translate(${margin.left},${margin.top})`);

  svg
    .append("g")
    .attr("class", "axis x-axis")
    .attr("transform", `translate(0,${height})`)
    .call(
      d3
        .axisBottom(xScale)
        .ticks(8)
        .tickFormat((value) => formatTime(value))
    )
    .call((g) => g.select(".domain").attr("stroke", "#94a3b8"));

  svg
    .append("g")
    .attr("class", "axis y-axis")
    .call(d3.axisLeft(hrScale).ticks(6))
    .call((g) => g.select(".domain").attr("stroke", "#94a3b8"))
    .call((g) => g.selectAll("line").attr("stroke", "#1e293b"));

  svg
    .append("g")
    .attr("class", "axis y-axis secondary")
    .attr("transform", `translate(${width},0)`)
    .call(
      d3
        .axisRight(paceScale)
        .ticks(6)
        .tickFormat((value) => `${value.toFixed(0)} s / 100m`)
    )
    .call((g) => g.select(".domain").attr("stroke", "#94a3b8"))
    .call((g) => g.selectAll("line").attr("stroke", "#1e293b"));

  svg
    .selectAll(".rest-block")
    .data(segments.filter((d) => d.rep_distance_meters === 0))
    .enter()
    .append("rect")
    .attr("class", "rest-block")
    .attr("x", (d) => xScale(d.startTime))
    .attr("y", 0)
    .attr("width", (d) => Math.max(xScale(d.endTime) - xScale(d.startTime), 1))
    .attr("height", height);

  const paceLine = d3
    .line()
    .defined((d) => d.rep_pace != null)
    .x((d) => xScale(d.startTime))
    .y((d) => paceScale(d.rep_pace));

  const hrLine = d3
    .line()
    .defined((d) => d.rep_avg_hr != null)
    .x((d) => xScale(d.startTime))
    .y((d) => hrScale(d.rep_avg_hr));

  svg
    .append("path")
    .datum(segments)
    .attr("class", "line pace-line")
    .attr("d", paceLine);

  svg
    .append("path")
    .datum(segments)
    .attr("class", "line hr-line")
    .attr("d", hrLine);

  const paceDots = svg
    .selectAll(".pace-point")
    .data(pacePoints)
    .enter()
    .append("circle")
    .attr("class", "pace-point")
    .attr("cx", (d) => xScale(d.startTime))
    .attr("cy", (d) => paceScale(d.rep_pace))
    .attr("r", 4)
    .attr("fill", "#38bdf8")
    .attr("stroke", "#0f172a")
    .attr("stroke-width", 1.5)
    .on("pointerenter", (event, datum) => {
      tooltip
        .style("display", "block")
        .html(`
          <strong>${datum.label}</strong><br/>
          Pace: ${formatPace(datum.rep_pace)}<br/>
          Heart rate: ${datum.rep_avg_hr ? datum.rep_avg_hr.toFixed(0) : "n/a"} bpm<br/>
          Duration: ${formatTime(datum.endTime - datum.startTime)}<br/>
          Distance: ${datum.rep_distance_meters.toFixed(0)} m
        `);
    })
    .on("pointermove", (event) => {
      tooltip
        .style("left", `${event.pageX + 12}px`)
        .style("top", `${event.pageY - 12}px`);
    })
    .on("pointerleave", () => tooltip.style("display", "none"));

  const hrDots = svg
    .selectAll(".hr-point")
    .data(hrPoints)
    .enter()
    .append("circle")
    .attr("class", "hr-point")
    .attr("cx", (d) => xScale(d.startTime))
    .attr("cy", (d) => hrScale(d.rep_avg_hr))
    .attr("r", 3)
    .attr("fill", "#f97316")
    .attr("opacity", 0.7);

  svg
    .append("text")
    .attr("x", 0)
    .attr("y", -6)
    .attr("fill", "#cbd5f5")
    .attr("font-size", "0.9rem")
    .text(`Avg HR ${data.summary.avg_hr.toFixed(1)} bpm · Avg pace ${data.summary.avg_pace.toFixed(0)} s/100m`);
}

window.updateSessionData = (payload) => {
  if (!payload || !payload.segments) {
    setLoading(true);
    return;
  }
  console.log('incoming session data', payload);
  setLoading(false);
  renderChart(payload);
};

window.tryConsumeFlutterPayload = function () {
  if (window.flutterSwimPayload && window.flutterSwimPayload.segments) {
    console.log('consuming flutter payload', window.flutterSwimPayload);
    setLoading(false);
    renderChart(window.flutterSwimPayload);
    window.flutterSwimPayload = null;
  } else {
    window.requestAnimationFrame(window.tryConsumeFlutterPayload);
  }
};

window.tryConsumeFlutterPayload();

    function formatTime(value) {
      const minutes = Math.floor(value / 60);
      const seconds = Math.round(value % 60)
        .toString()
        .padStart(2, "0");
      return `${minutes}:${seconds}`;
    }

    function formatPace(value) {
      if (value == null || Number.isNaN(value)) {
        return "n/a";
      }
      return `${value.toFixed(1)} s / 100m`;
    }
  </script>
