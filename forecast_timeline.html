<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>Training Forecast Plan</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap");

    :root {
      --background-color: #FFFFFF;
      --body-background-color: #FFFFFF;
      --text-color: #004448;
      --muted-text-color: rgba(0, 68, 72, 0.4);
      --surface-color: #ffffff;
      --border-color: #CFC4DB;
      --tooltip-background: #000000;
      --tooltip-text: #FFFFFF;
      --line-color: #1A3E3E;
      --dot-normal: #CFC4DB;
      --dot-race: #E45F5D;
      --dot-deload: #FFE9C3;
      --dot-prep: #91BDCD;
      --axis-text-color: #91BDCD;
      --focus-line-color: #91BDCD;
      font-family: "Poppins", sans-serif;
      color: var(--text-color);
      background: var(--background-color);
    }

    :root.dark-mode {
      --background-color: #151820;
      --body-background-color: #151820;
      --text-color: #f6fdff;
      --muted-text-color: rgba(229, 251, 252, 0.4);
      --surface-color: #151820;
      --border-color: #CFC4DB;
      --tooltip-background: #000000;
      --tooltip-text: #FFFFFF;
      --line-color: #f6fdff;
      --dot-normal: #CFC4DB;
      --dot-race: #E45F5D;
      --axis-text-color: #91BDCD;
      --focus-line-color: #91BDCD;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--body-background-color);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .chart-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 0;
      box-sizing: border-box;
      overflow: hidden;
    }

    #chart-container {
      flex: 1;
      position: relative;
      min-height: 0;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      display: block;
      width: 100%;
    }

    #chart {
      height: 100%;
      display: block;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    .axis text {
      fill: var(--axis-text-color);
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
    }

    .axis line, .axis path {
      stroke: none;
    }

    .grid line {
      stroke: var(--border-color);
      stroke-opacity: 0.15;
      shape-rendering: crispEdges;
    }

    .grid path {
      stroke-width: 0;
    }

    .line {
      fill: none;
      stroke: var(--line-color);
      stroke-width: 4;
      stroke-linejoin: round;
      stroke-linecap: round;
      opacity: 0.8;
    }

    .dot {
      stroke: var(--background-color);
      stroke-width: 2;
      cursor: pointer;
      transition: r 0.2s ease;
    }

    .dot-normal {
      fill: #CFC4DB;
    }

    .dot-race {
      fill: var(--dot-race);
    }

    .dot-deload {
      fill: var(--dot-deload);
    }

    .dot-prep {
      fill: var(--dot-prep);
    }

    .focus-line {
      stroke: var(--focus-line-color);
      stroke-width: 1.5;
      stroke-dasharray: 6 4;
      display: none;
    }

    .tooltip {
      position: absolute;
      background: var(--tooltip-background);
      color: var(--tooltip-text);
      padding: 10px 20px; /* Reduced padding */
      border-radius: 16px; /* Slightly tighter corners */
      pointer-events: none;
      display: none;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      z-index: 100;
      transform: translate(-50%, -100%);
      margin-top: -8px;
      min-width: 140px;
      max-width: 220px; /* Prevent it from getting too wide */
      overflow: hidden;
    }

    .tooltip .week-label {
      font-size: 10px; /* Shrunk from 11px */
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 1px;
      letter-spacing: 0.05em;
      opacity: 0.7;
      white-space: nowrap;
    }

    .tooltip .distance-value {
      font-size: 16px; /* Shrunk from 18px */
      font-weight: 600;
      line-height: 1.1;
      margin-bottom: 3px;
      white-space: nowrap;
    }

    .tooltip .info-row {
      font-size: 11px; /* Shrunk from 12px */
      font-weight: 500;
      margin-top: 1px;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .tooltip .race-row {
      color: #E45F5D;
    }

    .tooltip .prep-row {
      color: #91BDCD;
    }

    #loading {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      background: var(--background-color);
    }

    .loading-placeholder {
      width: 100%;
      height: 100%;
      position: absolute;
      opacity: 0.1;
      filter: blur(8px);
      pointer-events: none;
      display: flex;
      align-items: center;
      padding: 40px;
      box-sizing: border-box;
    }

    .placeholder-line {
      width: 100%;
      height: 4px;
      background: var(--line-color);
      position: relative;
    }

    .placeholder-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--dot-normal);
      position: absolute;
      top: -5px;
    }

    #loading-text {
      position: relative;
      z-index: 201;
      font-size: 16px;
      font-weight: 700;
      color: var(--text-color);
      background: rgba(255, 255, 255, 0.9);
      padding: 12px 24px;
      border-radius: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    :root.dark-mode #loading-text {
      background: rgba(21, 24, 32, 0.9);
    }
  </style>
</head>
<body>
  <div class="chart-wrapper">
    <div id="chart-container">
      <div id="loading">
        <div class="loading-placeholder">
          <div class="placeholder-line">
            <div class="placeholder-dot" style="left: 10%"></div>
            <div class="placeholder-dot" style="left: 30%; background: var(--dot-deload)"></div>
            <div class="placeholder-dot" style="left: 50%"></div>
            <div class="placeholder-dot" style="left: 70%; background: var(--dot-race); width: 20px; height: 20px; top: -8px"></div>
            <div class="placeholder-dot" style="left: 90%"></div>
          </div>
        </div>
        <div id="loading-text">Loading training plan...</div>
      </div>
      <div id="chart"></div>
      <div class="tooltip" id="tooltip">
        <div class="week-label" id="tooltip-date-range">21 Dec - 28 Dec</div>
        <div class="distance-value" id="tooltip-distance">10,740m</div>
        <div id="tooltip-extra-info"></div>
      </div>
    </div>
  </div>

  <script>
    const chartContainer = d3.select("#chart");
    const tooltip = d3.select("#tooltip");
    const loading = d3.select("#loading");

    const functionUrl = "https://kftdzpugxfrhddsymmol.supabase.co/functions/v1/forecast-training-plan";

    let margin = { top: 0, right: 25, bottom: 5, left: 35 };
    let width, height;

    function parseToken() {
      const params = new URLSearchParams(window.location.search);
      return params.get("token");
    }

    function parseUserId() {
      const params = new URLSearchParams(window.location.search);
      return params.get("userId");
    }

    async function fetchForecast(userId, token) {
      const headers = new Headers({ 
        "accept": "application/json",
        "content-type": "application/json"
      });
      if (token) {
        headers.set("authorization", `Bearer ${token}`);
      }
      const resp = await fetch(functionUrl, {
        method: "POST",
        headers,
        body: JSON.stringify({ userId })
      });
      if (!resp.ok) {
        throw new Error(`Function returned ${resp.status}`);
      }
      const data = await resp.json();
      return data.payload || data;
    }

    function updateDimensions(weekCount = 8) {
      const container = document.getElementById("chart-container");
      const weekWidth = 60; 
      const minContentWidth = (weekCount * weekWidth) + margin.left + margin.right;
      
      width = Math.max(container.clientWidth, minContentWidth) - margin.left - margin.right;
      // Adjusted height to fit within the 150px constraint
      height = (container.clientHeight || 150) - margin.top - margin.bottom;
      
      const chartDiv = document.getElementById("chart");
      chartDiv.style.width = (width + margin.left + margin.right) + "px";
    }

    function applyTheme() {
      const params = new URLSearchParams(window.location.search);
      const theme = params.get('theme') || params.get('mode') || params.get('appearance');
      let isDark = false;
      
      if (theme) {
        isDark = theme.toLowerCase().includes('dark');
      } else {
        isDark = window.matchMedia?.("(prefers-color-scheme: dark)")?.matches;
      }
      
      document.documentElement.classList.toggle("dark-mode", isDark);
    }
    applyTheme();

    async function init() {
      try {
        const params = new URLSearchParams(window.location.search);
        const dataParam = params.get('data');
        const token = parseToken();
        const userId = parseUserId();
        
        let data;
        if (dataParam) {
          try {
            data = JSON.parse(decodeURIComponent(dataParam));
          } catch (e) {
            console.warn("Failed to parse data param, will try to fetch if userId/token available");
          }
        }

        if (!data && userId && token) {
          d3.select("#loading-text").text("Fetching forecast...");
          data = await fetchForecast(userId, token);
        }

        if (!data) {
          // Default placeholder matches the provided JSON structure
          data = {
            weeks: [
              { week_number: 19, week_start: "2025-12-22", week_end: "2025-12-28", weekly_total_distance: 5400, has_primary_race: false, has_secondary_race: false, has_race_prep: true, sessions: [{ is_prep: true, session_type_name: "Endurance", target_distance: 1800 }] },
              { week_number: 20, week_start: "2025-12-29", week_end: "2026-01-04", weekly_total_distance: 5600, has_primary_race: false, has_secondary_race: false, has_race_prep: false, sessions: [] },
              { week_number: 21, week_start: "2026-01-05", week_end: "2026-01-11", weekly_total_distance: 7200, has_primary_race: false, has_secondary_race: false, has_race_prep: false, sessions: [] },
              { week_number: 22, week_start: "2026-01-12", week_end: "2026-01-18", weekly_total_distance: 5600, has_primary_race: false, has_secondary_race: false, has_race_prep: true, sessions: [{ is_prep: true, session_type_name: "Endurance", target_distance: 2000 }] },
              { week_number: 23, week_start: "2026-01-19", week_end: "2026-01-25", weekly_total_distance: 7200, has_primary_race: false, has_secondary_race: false, has_race_prep: false, sessions: [] },
              { week_number: 24, week_start: "2026-01-26", week_end: "2026-02-01", weekly_total_distance: 4700, has_primary_race: true, primary_race_name: "aero test", primary_race_distance: 2000, has_secondary_race: false, has_race_prep: false, sessions: [] },
              { week_number: 25, week_start: "2026-02-02", week_end: "2026-02-08", weekly_total_distance: 7200, has_primary_race: false, has_secondary_race: false, has_race_prep: false, sessions: [] },
              { week_number: 26, week_start: "2026-02-09", week_end: "2026-02-15", weekly_total_distance: 7200, has_primary_race: false, has_secondary_race: false, has_race_prep: false, sessions: [] }
            ]
          };
        }

        loading.style("display", "none");
        updateDimensions(data.weeks.length);
        renderChart(data.weeks);
        
        window.addEventListener('resize', () => {
          chartContainer.selectAll("*").remove();
          updateDimensions(data.weeks.length);
          renderChart(data.weeks);
        });
      } catch (e) {
        console.error("Error initializing chart:", e);
        d3.select("#loading-text").text("Error: " + e.message);
      }
    }

    function renderChart(weeks) {
      const svg = chartContainer.append("svg")
        .attr("width", width + margin.left + margin.right)
        .attr("height", height + margin.top + margin.bottom)
        .append("g")
        .attr("transform", `translate(${margin.left},${margin.top})`);

      const weekNumbers = weeks.map(d => d.week_number);
      const xScale = d3.scaleLinear()
        .domain([d3.min(weekNumbers), d3.max(weekNumbers)])
        .range([0, width]);

      const yScale = d3.scaleLinear()
        .domain([0, d3.max(weeks, d => d.weekly_total_distance) * 1.2])
        .range([height, 0])
        .nice();

      // Y Axis
      svg.append("g")
        .attr("class", "axis y-axis")
        .call(d3.axisLeft(yScale)
          .ticks(5)
          .tickFormat(d => d === 0 ? "0" : d >= 1000 ? (d/1000) + "k" : d)
        );

      // Horizontal Grid Lines
      svg.append("g")
        .attr("class", "grid")
        .call(d3.axisLeft(yScale)
          .ticks(5)
          .tickSize(-width)
          .tickFormat("")
        );

      // X Axis
      svg.append("g")
        .attr("class", "axis x-axis")
        .attr("transform", `translate(0,${height})`)
        .call(d3.axisBottom(xScale)
          .ticks(weeks.length)
          .tickFormat("") // Removed x axis labels
        );

      // Focus Line
      const focusLine = svg.append("line")
        .attr("class", "focus-line")
        .attr("y1", -30)
        .attr("y2", height);

      // Path
      const lineGenerator = d3.line()
        .x(d => xScale(d.week_number))
        .y(d => yScale(d.weekly_total_distance))
        .curve(d3.curveMonotoneX);

      svg.append("path")
        .datum(weeks)
        .attr("class", "line")
        .attr("d", lineGenerator);

      // Dots
      const dots = svg.selectAll(".dot")
        .data(weeks)
        .enter()
        .append("circle")
        .attr("class", d => {
          const hasPrep = d.has_race_prep || (d.sessions && d.sessions.some(s => s.is_prep));
          if (d.has_primary_race || d.has_secondary_race) return 'dot dot-race';
          if (hasPrep) return 'dot dot-prep'; // Blue priority for prep
          if (d.is_deload) return 'dot dot-deload'; // Beige for recovery
          return 'dot dot-normal';
        })
        .attr("cx", d => xScale(d.week_number))
        .attr("cy", d => yScale(d.weekly_total_distance))
        .attr("r", d => d.has_primary_race || d.has_secondary_race ? 10 : 7);

      // Overlay
      const overlay = svg.append("rect")
        .attr("width", width)
        .attr("height", height)
        .attr("fill", "transparent")
        .style("cursor", "crosshair")
        .style("pointer-events", "all")
        .style("touch-action", "pan-x"); // Ensure mobile horizontal scrolling works over the chart

      function handleInteraction(event) {
        const [mx] = d3.pointer(event);
        const invertedX = xScale.invert(mx);
        const week = weeks.reduce((prev, curr) => 
          Math.abs(curr.week_number - invertedX) < Math.abs(prev.week_number - invertedX) ? curr : prev
        );
        
        if (week) showFocus(week, xScale, yScale);
      }

      overlay.on("mousemove touchmove", handleInteraction);
      overlay.on("click", handleInteraction);

      // Initial focus
      showFocus(weeks[0], xScale, yScale);
    }

    function formatDate(dateStr) {
      if (!dateStr) return "";
      const date = new Date(dateStr);
      return date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    }

    function showFocus(d, xScale, yScale) {
      const x = xScale(d.week_number);
      const y = yScale(d.weekly_total_distance);

      const start = formatDate(d.week_start);
      const end = formatDate(d.week_end);
      d3.select("#tooltip-date-range").text(`${start} - ${end}`);
      d3.select("#tooltip-distance").text(`${d.weekly_total_distance.toLocaleString()}m`);
      
      const extraInfo = d3.select("#tooltip-extra-info");
      extraInfo.selectAll("*").remove();

      // Race details
      if (d.has_primary_race || d.has_secondary_race) {
        const raceName = d.has_primary_race ? d.primary_race_name : d.secondary_race_name;
        const raceDist = d.has_primary_race ? d.primary_race_distance : d.secondary_race_distance;
        if (raceName) {
          extraInfo.append("div")
            .attr("class", "info-row race-row")
            .html(`🏁 ${raceName}: ${raceDist ? raceDist.toLocaleString() + 'm' : ''}`);
        }
      }

      // Race Prep
      if (d.has_race_prep) {
        const prepSession = d.sessions.find(s => s.is_prep);
        if (prepSession) {
          extraInfo.append("div")
            .attr("class", "info-row prep-row")
            .text(`${prepSession.session_type_name}: ${prepSession.target_distance.toLocaleString()}m`);
        }
      } else if (d.is_deload && !d.has_primary_race && !d.has_secondary_race) {
        extraInfo.append("div")
          .attr("class", "info-row prep-row")
          .style("color", "#FFE9C3")
          .text("DELOAD");
      }
      
      tooltip.style("display", "flex");
      
      const container = document.getElementById("chart-container");
      const tooltipNode = tooltip.node();
      const th = tooltipNode.offsetHeight;
      const tw = tooltipNode.offsetWidth;
      const cw = container.clientWidth;
      const ch = container.clientHeight || 150;
      
      // 1. Vertical Positioning
      let topPos = y + margin.top;
      let transformY = "-100%";
      let verticalOffset = -10; // Gap above the point

      if (topPos - th < 5) {
        // Flip to bottom if top overflow
        transformY = "0%";
        verticalOffset = 15; // Gap below the point
      }
      
      // Check for bottom overflow after flip
      if (transformY === "0%" && topPos + verticalOffset + th > ch - 5) {
        // If it still overflows at bottom, push it up as much as possible
        topPos = Math.max(5, ch - th - 5);
        transformY = "0%";
        verticalOffset = 0;
      }

      // 2. Horizontal Positioning (Clamping)
      let leftPos = x + margin.left;
      
      // Clamp the tooltip within the visible container width
      // Taking the current scroll position into account
      const scrollLeft = container.scrollLeft;
      const minLeft = scrollLeft + (tw / 2) + 5;
      const maxLeft = scrollLeft + cw - (tw / 2) - 5;
      
      leftPos = Math.max(minLeft, Math.min(maxLeft, leftPos));

      tooltip
        .style("left", `${leftPos}px`)
        .style("top", `${topPos + verticalOffset}px`)
        .style("transform", `translate(-50%, ${transformY})`);

      d3.select(".focus-line")
        .style("display", "block")
        .attr("x1", x)
        .attr("x2", x);

      // Animate dots on focus
      d3.selectAll(".dot").attr("r", dot => {
        const isSelected = dot.week_number === d.week_number;
        const isBig = dot.has_primary_race || dot.has_secondary_race || (dot.has_race_prep || (dot.sessions && dot.sessions.some(s => s.is_prep)));
        
        if (isSelected) return isBig ? 13 : 9;
        return isBig ? 10 : 7;
      });

      // Auto-scroll to current week if first time showing
      if (!window.hasScrolledToCurrent) {
        container.scrollLeft = Math.max(0, x + margin.left - cw / 2);
        window.hasScrolledToCurrent = true;
      }
    }

    init();
  </script>
</body>
</html>
