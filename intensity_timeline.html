<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>Swim Intensity Timeline</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap");

    :root {
      --background-color: #FFFFFF;
      --body-background-color: #FFFFFF;
      --text-color: #004448;
      --muted-text-color: rgba(0, 68, 72, 0.75);
      --surface-color: #ffffff;
      --border-color: #CFC4DB;
      --tooltip-background: #ffffff;
      --tooltip-border: #CFC4DB;
      --focus-readout-background: #ffffff;
      --focus-readout-border: #CFC4DB;
      --focus-line-color: rgba(0, 68, 72, 0.7);
      --rest-block-color: #E5E5E5;
      --axis-text-color: #004448;
      --legend-color: #004448;
      font-family: "Poppins", "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text-color);
      background: var(--background-color);
    }

    :root.dark-mode {
      --background-color: #151820;
      --body-background-color: #151820;
      --text-color: #f6fdff;
      --muted-text-color: rgba(229, 251, 252, 0.75);
      --surface-color: #151820;
      --border-color: #CFC4DB;
      --tooltip-background: #151820;
      --tooltip-border: #CFC4DB;
      --focus-readout-background: #151820;
      --focus-readout-border: #CFC4DB;
      --focus-line-color: #CFC4DB;
      --rest-block-color: rgba(229, 229, 229, 0.35);
      --axis-text-color: #f6fdff;
      --legend-color: #f6fdff;
    }

    html {
      height: auto;
      overflow: visible;
    }

    body {
      height: auto;
      min-height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      position: relative;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--body-background-color);
      font-family: "Poppins", "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text-color);
    }

    .chart-wrapper {
      width: 100%;
      max-width: none;
      margin: 0;
      box-sizing: border-box;
      padding: 0;
      display: flex;
      flex-direction: column;
    }

    .chart-frame {
      margin-top: 16px;
      padding: 0;
      border: none;
      background: transparent;
      box-sizing: border-box;
      display: block;
    }

    #loading {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      background: transparent;
      border: 1px solid var(--border-color);
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-color);
      letter-spacing: 0.02em;
      font-family: inherit;
    }

    .focus-readout {
      margin-top: 12px;
      padding: 12px 0;
      border-radius: 0;
      border: none;
      background: transparent;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      color: var(--text-color);
      font-size: 12px;
    }

    .focus-readout .label {
      font-size: 12px;
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0;
      color: var(--muted-text-color);
      margin-bottom: 0.1rem;
    }

    .focus-readout .value {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .focus-readout.empty {
      justify-content: center;
      font-size: 0.9rem;
      font-weight: 500;
      opacity: 0.8;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 0.25rem;
    }

    p {
      margin-top: 0;
      color: var(--text-color);
      font-size: 0.95rem;
    }

    #chart {
      position: relative;
      width: 100%;
    }

    svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .axis line,
    .axis path {
      stroke: none;
    }

    .axis text {
      fill: var(--axis-text-color);
      font-size: 20px;
      font-family: inherit;
    }

    .line {
      fill: none;
      stroke-linecap: round;
      stroke-width: 3;
    }

    .hr-line {
      stroke: #E45F5D;
    }


    .tooltip {
      position: absolute;
      padding: 0.65rem 0.85rem;
      border-radius: 0.55rem;
      background: var(--tooltip-background);
      border: 1px solid var(--tooltip-border);
      pointer-events: none;
      font-size: 0.85rem;
      line-height: 1.4;
      display: none;
      box-shadow: 0 10px 30px rgba(0, 68, 72, 0.15);
      font-family: inherit;
      color: var(--text-color);
    }

    .legend {
      display: flex;
      gap: 0.9rem;
      margin-top: 12px;
      font-size: 12px;
      font-weight: 400;
      color: var(--legend-color);
      flex-wrap: wrap;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      display: inline-block;
      margin-right: 0.35rem;
      vertical-align: middle;
    }

    .legend-dot.intensity-gradient {
      background: linear-gradient(90deg, #2563eb, #facc15, #22c55e, #b91c1c);
    }

    .work-block {
      opacity: 0.22;
    }

    .rest-block {
      fill: var(--rest-block-color);
      opacity: 0.2;
    }

    .interaction-overlay {
      fill: transparent;
      cursor: crosshair;
      touch-action: none;
    }

    .focus-line {
      stroke: var(--focus-line-color);
      stroke-width: 2.5px;
      stroke-dasharray: 4 3;
      display: none;
    }

    .focus-dot {
      r: 5;
      stroke: #fff;
      stroke-width: 2px;
      display: none;
    }

    .focus-dot.hr {
      fill: #E45F5D;
    }

    .focus-dot.pace {
      fill: #91BDCD;
    }

    .focus-handle {
      display: none;
      fill: var(--text-color);
      stroke: var(--surface-color);
      stroke-width: 2px;
      r: 6;
    }
  </style>
</head>
<body>
  <div class="chart-wrapper">
    <div class="chart-frame">
      <div id="chart"></div>
      <div class="legend">
        <span><span class="legend-dot" style="background:#E45F5D"></span>Heart rate (bpm)</span>
        <span><span class="legend-dot" style="background:#91BDCD"></span>Pace (per 100 m)</span>
        <span><span class="legend-dot" style="background:var(--rest-block-color)"></span>Rest periods</span>
      </div>
    </div>
  </div>
  <div id="focus-readout" class="focus-readout empty">Tap anywhere to find out more.</div>
  <div class="tooltip" id="tooltip"></div>
  <div id="loading">Loading…</div>

  <script>
    const tooltip = d3.select("#tooltip");
    const readoutEl = document.getElementById("focus-readout");
    const width = 940;
    // Calculate height dynamically - will be recalculated in renderChart based on actual container
    let height = Math.max(600, window.innerHeight * 0.8);
    const margin = { top: 0, right: 65, bottom: 0, left: 60 };
    const DURATION_ALIGNMENT_TOLERANCE = 0.02;
    const loadingEl = document.getElementById("loading");
    const functionUrl = "https://kftdzpugxfrhddsymmol.supabase.co/functions/v1/swim-timeline";
    const intensityPalette = {
      rest: { label: "Rest", color: "#E5E5E5" },
      easy: { label: "Easy", color: "#2563eb" },
      medium: { label: "Medium", color: "#facc15" },
      fast: { label: "Fast", color: "#22c55e" },
      max: { label: "Max", color: "#b91c1c" },
    };

    const themePreferenceParam = getThemeParam();
    const resolvedDarkMode = resolveDarkModePreference(themePreferenceParam);
    applyDocumentTheme(resolvedDarkMode);
    if (!themePreferenceParam) {
      attachSystemThemeListener();
    }

    function setLoading(show) {
      if (!loadingEl) return;
      loadingEl.textContent = "Loading…";
      loadingEl.style.display = show ? "block" : "none";
    }

    function resetReadout(message = "Tap anywhere to find out more.") {
      if (!readoutEl) return;
      readoutEl.classList.add("empty");
      readoutEl.textContent = message;
    }

    setLoading(true);
    resetReadout();

    async function fetchSession(sessionId, token) {
      const headers = new Headers({ accept: "application/json" });
      if (token) {
        headers.set("authorization", `Bearer ${token}`);
      }
      const resp = await fetch(`${functionUrl}?sessionId=${encodeURIComponent(sessionId)}`, {
        headers,
      });
      if (!resp.ok) {
        throw new Error(`Function returned ${resp.status}`);
      }
      const payload = await resp.json();
      if (!payload?.sessionData) {
        throw new Error("Session data missing");
      }
      return payload.sessionData;
    }

    function showError(message) {
      if (loadingEl) {
        loadingEl.textContent = message;
      }
      resetReadout(message);
      setLoading(true);
    }

    function parseSessionId() {
      const params = new URLSearchParams(window.location.search);
      return params.get("sessionId");
    }

    async function hydrateChart() {
      const sessionId = parseSessionId();
      if (!sessionId) {
        showError("Missing session id");
        return;
      }
      const token = parseToken();
      try {
        const payload = await fetchSession(sessionId, token);
        setLoading(false);
        renderChart(payload);
        if (token) {
          window.history.replaceState({}, "", window.location.pathname + window.location.search.replace(/&?token=[^&]*/, ""));
        }
      } catch (error) {
        console.error(error);
        showError("Unable to load swim data");
      }
    }

    function parseToken() {
      const params = new URLSearchParams(window.location.search);
      return params.get("token");
    }

    function getThemeParam() {
      const params = new URLSearchParams(window.location.search);
      const candidate = params.get("theme") ?? params.get("mode") ?? params.get("appearance");
      if (!candidate) {
        return null;
      }
      const normalized = candidate.toLowerCase();
      if (normalized.includes("dark")) {
        return "dark";
      }
      if (normalized.includes("light")) {
        return "light";
      }
      return null;
    }

    function resolveDarkModePreference(themeParam) {
      if (themeParam === "dark") {
        return true;
      }
      if (themeParam === "light") {
        return false;
      }
      return window.matchMedia?.("(prefers-color-scheme: dark)")?.matches ?? false;
    }

    function applyDocumentTheme(isDark) {
      const root = document.documentElement;
      if (!root) {
        return;
      }
      root.classList.toggle("dark-mode", Boolean(isDark));
      if (document.body) {
        document.body.classList.toggle("dark-mode", Boolean(isDark));
      }
    }

    function attachSystemThemeListener() {
      const mediaQuery = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
      if (!mediaQuery) {
        return;
      }
      const updateTheme = (event) => applyDocumentTheme(event.matches);
      if (mediaQuery.addEventListener) {
        mediaQuery.addEventListener("change", updateTheme);
      } else if (mediaQuery.addListener) {
        mediaQuery.addListener(updateTheme);
      }
    }

    function renderChart(data) {
      resetReadout();
      
      // Recalculate height based on actual container or viewport
      const chartContainer = document.getElementById("chart");
      if (chartContainer && chartContainer.offsetHeight > 0) {
        height = chartContainer.offsetHeight - margin.top - margin.bottom;
      } else {
        // Use a reasonable default if container height not available
        height = Math.max(400, window.innerHeight * 0.6);
      }

      const providerDetail = data.provider_workout_detail ?? null;
      const sessionReferenceSeconds = getSessionReferenceSeconds(providerDetail);
      const segments = [];
      let cumulative = 0;

    (data.segments ?? []).forEach((segment) => {
        const duration = Math.max(segment.rep_time_seconds ?? 0, 0);
        const startTime = cumulative;
        cumulative += duration;
        const distance = segment.rep_distance_meters ?? 0;
        const isRest = distance <= 0;
        segments.push({
          ...segment,
          startTime,
          endTime: startTime + duration,
          midTime: startTime + duration / 2,
          isRest,
          intensity: inferIntensity(segment.rep_description, isRest),
          label: `${segment.rep_description ?? "Segment"} · ${distance > 0 ? `${distance.toFixed(0)} m` : "rest"}`,
        });
      });

      applyActualSegmentTimings(segments, providerDetail, sessionReferenceSeconds);

      let totalDuration = cumulative || data.summary?.total_duration || 0;
      const timelineEnd = segments[segments.length - 1]?.endTime;
      if (Number.isFinite(timelineEnd) && timelineEnd > 0) {
        totalDuration = timelineEnd;
      }

      const clipRange = [
        segments[0]?.startTime ?? 0,
        segments[segments.length - 1]?.endTime ?? totalDuration,
      ];

      const heartRateSeries = buildHeartRateSeries(providerDetail, segments, totalDuration, {
        referenceSeconds: sessionReferenceSeconds,
        clipRange,
      });
      let hrSeries = heartRateSeries.length
        ? heartRateSeries
        : segments
            .filter((seg) => seg.rep_avg_hr != null)
            .map((seg) => ({
              time: seg.midTime,
              value: seg.rep_avg_hr,
            }));

      if (hrSeries.length) {
        const lastBeforeAlignment = hrSeries[hrSeries.length - 1];
        const expectedDuration = segments.length
          ? totalDuration
          : Math.max(totalDuration, lastBeforeAlignment?.time ?? 0);
        const shouldRescale =
          segments.length > 0 &&
          expectedDuration > 0 &&
          (lastBeforeAlignment?.time ?? 0) > 0;
        if (shouldRescale) {
          const durationDelta = Math.abs((lastBeforeAlignment?.time ?? 0) - expectedDuration);
          const relativeDelta = durationDelta / Math.max(lastBeforeAlignment.time, expectedDuration);
          if (relativeDelta > DURATION_ALIGNMENT_TOLERANCE) {
            const scaleFactor = expectedDuration / lastBeforeAlignment.time;
            const hrCount = hrSeries.length;
            hrSeries = hrSeries.map((sample, idx) => ({
              ...sample,
              time: idx === hrCount - 1 ? expectedDuration : sample.time * scaleFactor,
            }));
          }
        }
        const latestPoint = hrSeries[hrSeries.length - 1];
        if (expectedDuration && latestPoint.time < expectedDuration) {
          hrSeries = [...hrSeries, { time: expectedDuration, value: latestPoint.value }];
        }
      }

      const paceSegments = segments.filter((seg) => !seg.isRest && seg.rep_pace != null);

      let paceSeries = paceSegments.map((seg) => ({
        time: seg.midTime ?? seg.startTime,
        value: seg.rep_pace,
        label: seg.label,
        rep_avg_hr: seg.rep_avg_hr,
        duration: seg.endTime - seg.startTime,
        intensity: seg.intensity,
      }));

      if (paceSeries.length) {
        paceSeries = paceSeries.sort((a, b) => a.time - b.time);
        const paceFirst = paceSeries[0];
        const paceLast = paceSeries[paceSeries.length - 1];
        if (paceFirst.time > 0) {
          paceSeries = [{ ...paceFirst, time: 0 }, ...paceSeries];
        }
        const sessionEnd = totalDuration || segments[segments.length - 1]?.endTime || paceLast.time;
        if (sessionEnd && paceLast.time < sessionEnd) {
          paceSeries = [
            ...paceSeries,
            {
              ...paceLast,
              time: sessionEnd,
            },
          ];
        }
      }

      const hrMaxTime = hrSeries.length ? d3.max(hrSeries, (d) => d.time) : 0;
      const domainMax = Math.max(totalDuration, hrMaxTime ?? 0);

      const paceExtent = d3.extent(paceSeries, (d) => d.value);
      const pacePadding = 12;
      const hrExtent = d3.extent(hrSeries, (d) => d.value);
      const hrPadding = 12;

      const paceScale = d3
        .scaleLinear()
        .domain([
          (paceExtent[1] ?? 150) + pacePadding,
          Math.max(0, (paceExtent[0] ?? 80) - pacePadding),
        ])
        .range([height, 0])
        .nice();

      const hrScale = d3
        .scaleLinear()
        .domain([
          Math.min(hrExtent[0] ?? 110, 90) - hrPadding,
          Math.max(hrExtent[1] ?? 160, 180) + hrPadding,
        ])
        .range([height, 0])
        .nice();

      const xScale = d3
        .scaleLinear()
        .domain([0, domainMax || totalDuration || 1])
        .range([0, width])
        .nice();
      const baseXScale = xScale.copy();
      let currentXScale = baseXScale;

      const chart = d3.select("#chart");
      chart.selectAll("*").remove();

      const svgWidth = width + margin.left + margin.right;
      const svgHeight = height + margin.top + margin.bottom;

      const rootSvg = chart
        .append("svg")
        .attr("width", svgWidth)
        .attr("height", svgHeight)
        .attr("viewBox", `0 0 ${svgWidth} ${svgHeight}`);

      const clipId = `plot-clip-${Math.random().toString(36).slice(2)}`;
      rootSvg
        .append("defs")
        .append("clipPath")
        .attr("id", clipId)
        .attr("clipPathUnits", "userSpaceOnUse")
        .append("rect")
        .attr("x", 0)
        .attr("y", 0)
        .attr("width", width)
        .attr("height", height);

      const axisGroup = rootSvg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);
      const plotGroup = rootSvg
        .append("g")
        .attr("class", "plot-area")
        .attr("transform", `translate(${margin.left},${margin.top})`)
        .attr("clip-path", `url(#${clipId})`);

      const xAxis = axisGroup
        .append("g")
        .attr("class", "axis x-axis")
        .attr("transform", `translate(0,${height})`)
        .call(
          d3
            .axisBottom(currentXScale)
            .ticks(Math.min(8, Math.ceil(totalDuration / 120)))
            .tickFormat((value) => formatTime(value))
        )
        .call((g) => {
          g.select(".domain").attr("stroke", "none");
          g.selectAll("line").attr("stroke", "none");
        });

      axisGroup
        .append("g")
        .attr("class", "axis y-axis")
        .call(d3.axisLeft(hrScale).ticks(6))
        .call((g) => {
          g.select(".domain").attr("stroke", "none");
          g.selectAll("line").attr("stroke", "none");
        });

      axisGroup
        .append("g")
        .attr("class", "axis y-axis secondary")
        .attr("transform", `translate(${width},0)`)
        .call(
          d3
            .axisRight(paceScale)
            .ticks(6)
            .tickFormat((value) => formatPace(value, false))
        )
        .call((g) => {
          g.select(".domain").attr("stroke", "none");
          g.selectAll("line").attr("stroke", "none");
        });

      const restBlocks = plotGroup
        .selectAll(".rest-block")
        .data(segments.filter((d) => d.isRest))
        .enter()
        .append("rect")
        .attr("class", "rest-block")
        .attr("x", (d) => currentXScale(d.startTime))
        .attr("y", 0)
        .attr("width", (d) => Math.max(currentXScale(d.endTime) - currentXScale(d.startTime), 1))
        .attr("height", height)
        .attr("opacity", 0.2);

      const paceBars = plotGroup
        .selectAll(".pace-bar")
        .data(paceSegments)
        .enter()
        .append("rect")
        .attr("class", "pace-bar")
        .attr("x", (d) => {
          const xStart = currentXScale(d.startTime);
          return isNaN(xStart) ? 0 : xStart;
        })
        .attr("y", (d) => paceScale(d.rep_pace))
        .attr("width", (d) => {
          const xStart = currentXScale(d.startTime);
          const xEnd = currentXScale(d.endTime);
          const barWidth = xEnd - xStart;
          return isNaN(barWidth) || barWidth <= 0 ? 1 : barWidth;
        })
        .attr("height", (d) => height - paceScale(d.rep_pace))
        .attr("fill", "#91BDCD")
        .attr("opacity", 0.8);

      const hrPath = plotGroup
        .append("path")
        .datum(hrSeries)
        .attr("class", "line hr-line")
        .attr(
          "d",
          d3
            .line()
            .defined((d) => d.value != null)
            .curve(d3.curveCatmullRom.alpha(0.35))
            .x((d) => currentXScale(d.time))
            .y((d) => hrScale(d.value))(hrSeries)
        );

      // Removed pace point markers per latest requirements

      const focusGroup = plotGroup.append("g").attr("class", "focus-group");
      const focusLine = focusGroup
        .append("line")
        .attr("class", "focus-line")
        .attr("y1", 0)
        .attr("y2", height);
      const focusHrDot = focusGroup.append("circle").attr("class", "focus-dot hr");
      const focusHandle = focusGroup
        .append("circle")
        .attr("class", "focus-handle")
        .attr("cy", -8);

      let activePointerId = null;
      let lastFocusTime = null;
      const activeTouchIds = new Set();
      let multiTouchActive = false;

      const overlay = plotGroup
        .append("rect")
        .attr("class", "interaction-overlay")
        .attr("width", width)
        .attr("height", height);

      const supportsPointerEvents = window.PointerEvent != null;

      if (supportsPointerEvents) {
        overlay
          .on("pointerdown.focus", (event) => {
            const node = overlay.node();
            if (event.pointerType === "touch") {
              activeTouchIds.add(event.pointerId);
              multiTouchActive = activeTouchIds.size > 1;
              if (multiTouchActive) {
                if (node && node.releasePointerCapture) {
                  node.releasePointerCapture(event.pointerId);
                }
                activePointerId = null;
                return;
              }
            }
            activePointerId = event.pointerId;
            if (node && node.setPointerCapture && event.pointerType !== "touch") {
              node.setPointerCapture(activePointerId);
            }
            handleFocus(event);
          })
          .on("pointermove.focus", (event) => {
            const isTouch = event.pointerType === "touch";
            const isActiveDrag = (event.buttons & 1) === 1 || isTouch;
            if (isTouch) {
              if (!activeTouchIds.has(event.pointerId) || multiTouchActive) {
                return;
              }
            }
            if (event.pointerId === activePointerId && isActiveDrag) {
              handleFocus(event);
            }
          })
          .on("pointerup.focus pointercancel.focus pointerleave.focus", (event) => {
            if (event.pointerType === "touch") {
              activeTouchIds.delete(event.pointerId);
              multiTouchActive = activeTouchIds.size > 1;
            }
            if (event.pointerId === activePointerId) {
              const node = overlay.node();
              if (node && node.releasePointerCapture && event.pointerType !== "touch") {
                node.releasePointerCapture(activePointerId);
              }
              activePointerId = null;
            }
          });
      } else {
        overlay
          .on("touchstart.focus", (event) => {
            if (event.touches && event.touches.length > 1) {
              multiTouchActive = true;
              activePointerId = null;
              return;
            }
            multiTouchActive = false;
            activePointerId = "touch";
            handleFocus(event);
          })
          .on("touchmove.focus", (event) => {
            if (multiTouchActive || activePointerId !== "touch") {
              return;
            }
            handleFocus(event);
          })
          .on("touchend.focus touchcancel.focus", () => {
            activePointerId = null;
            multiTouchActive = false;
          })
          .on("mousedown.focus", (event) => {
            activePointerId = "mouse";
            handleFocus(event);
          })
          .on("mousemove.focus", (event) => {
            const isActiveDrag = event.buttons == null ? event.which === 1 : (event.buttons & 1) === 1;
            if (activePointerId !== "mouse" || !isActiveDrag) {
              return;
            }
            handleFocus(event);
          })
          .on("mouseup.focus mouseleave.focus", () => {
            if (activePointerId === "mouse") {
              activePointerId = null;
            }
          });
      }

      let focusUpdateFrame = null;
      let pendingFocusState = null;
      let currentTransform = d3.zoomIdentity;
      const zoom = d3
        .zoom()
        .scaleExtent([1, 10])
        .translateExtent([
          [0, 0],
          [width, height],
        ])
        .extent([
          [0, 0],
          [width, height],
        ])
        .constrain((transform) => {
          const k = Math.max(1, Math.min(10, transform.k));
          const minTranslateX = width * (1 - k);
          const clampedX = Math.min(0, Math.max(minTranslateX, transform.x));
          return d3.zoomIdentity.translate(clampedX, 0).scale(k);
        })
        .on("zoom", (event) => {
          currentTransform = event.transform;
          applyXScale(currentTransform.rescaleX(baseXScale));
        });

      plotGroup.call(zoom).on("dblclick.zoom", null).on("wheel.zoom", null);

      function handleFocus(evt, explicitTime = null) {
        if (!overlay?.node()) {
          return;
        }
        if (evt && typeof evt.type === "string" && evt.type.startsWith("touch")) {
          evt.preventDefault();
        }
        let rawX = null;
        if (explicitTime != null) {
          rawX = currentXScale(explicitTime);
        } else if (evt) {
          const pointer = d3.pointer(evt, overlay.node());
          rawX = pointer ? pointer[0] : 0;
        } else {
          rawX = 0;
        }
        const clampedX = Math.max(0, Math.min(width, rawX ?? 0));
        const time = explicitTime != null ? explicitTime : currentXScale.invert(clampedX);
        pendingFocusState = { clampedX, time };
        if (focusUpdateFrame == null) {
          focusUpdateFrame = window.requestAnimationFrame(() => {
            focusUpdateFrame = null;
            if (!pendingFocusState) {
              return;
            }
            applyFocusState(pendingFocusState);
            pendingFocusState = null;
          });
        }
      }

      function applyFocusState({ clampedX, time }) {
        const nearestHr = findNearestSample(hrSeries, time);
        const segment = segments.find((seg) => time >= seg.startTime && time <= seg.endTime);
        const nearestPace = paceSeries.length ? findNearestSample(paceSeries, time) : null;
        const paceValue = nearestPace?.value ?? null;

        focusLine.attr("x1", clampedX).attr("x2", clampedX).style("display", "block");
        focusHandle.attr("cx", clampedX).style("display", "block");

        if (nearestHr) {
          focusHrDot
            .attr("cx", currentXScale(nearestHr.time))
            .attr("cy", hrScale(nearestHr.value))
            .style("display", "block");
        } else {
          focusHrDot.style("display", "none");
        }

        // Pace focus dot removed

        lastFocusTime = time;
        updateReadout({
          time,
          heartRate: nearestHr?.value ?? null,
          segment,
          pace: paceValue,
        });
      }

      function applyXScale(scale) {
        currentXScale = scale;
        xAxis
          .call(
            d3
              .axisBottom(currentXScale)
              .ticks(Math.min(8, Math.ceil(totalDuration / 120)))
              .tickFormat((value) => formatTime(value))
          )
          .call((g) => {
            g.select(".domain").attr("stroke", "none");
            g.selectAll("line").attr("stroke", "none");
          });

        restBlocks
          .attr("x", (d) => currentXScale(d.startTime))
          .attr("width", (d) => Math.max(currentXScale(d.endTime) - currentXScale(d.startTime), 1));

        paceBars
          .attr("x", (d) => {
            const xStart = currentXScale(d.startTime);
            return isNaN(xStart) ? 0 : xStart;
          })
          .attr("width", (d) => {
            const xStart = currentXScale(d.startTime);
            const xEnd = currentXScale(d.endTime);
            const barWidth = xEnd - xStart;
            return isNaN(barWidth) || barWidth <= 0 ? 1 : barWidth;
          });

        hrPath.attr(
          "d",
          d3
            .line()
            .defined((d) => d.value != null)
            .curve(d3.curveCatmullRom.alpha(0.35))
            .x((d) => currentXScale(d.time))
            .y((d) => hrScale(d.value))(hrSeries)
        );

        if (lastFocusTime != null) {
          handleFocus(null, lastFocusTime);
        }
      }

      const defaultFocusTime = domainMax ? domainMax / 2 : segments[0]?.midTime ?? 0;
      handleFocus(null, defaultFocusTime);

    }

    hydrateChart();

    function formatTime(value) {
      const safeValue = Number.isFinite(value) ? value : 0;
      const minutes = Math.floor(safeValue / 60);
      const seconds = Math.max(0, Math.round(safeValue % 60))
        .toString()
        .padStart(2, "0");
      return `${minutes}:${seconds}`;
    }

    function formatPace(value, includeUnit = true) {
      if (value == null || Number.isNaN(value)) {
        return "n/a";
      }
      const seconds = Math.max(0, value);
      const minutesPart = Math.floor(seconds / 60);
      const secondsPart = Math.round(seconds % 60)
        .toString()
        .padStart(2, "0");
      const formatted = `${minutesPart}m ${secondsPart}s`;
      return includeUnit ? `${formatted} / 100m` : formatted;
    }

    function inferIntensity(description = "", isRest = false) {
      if (isRest) {
        return "rest";
      }
      const text = description.toLowerCase();
      if (text.includes("warm") || text.includes("cool") || text.includes("easy") || text.includes("technique") || text.includes("drill")) {
        return "easy";
      }
      if (text.includes("max") || text.includes("all out") || text.includes("sprint")) {
        return "max";
      }
      if (text.includes("fast") || text.includes("hard")) {
        return "fast";
      }
      return "medium";
    }

    function buildHeartRateSeries(providerDetail, segments, sessionDuration, options = {}) {
      if (!providerDetail) {
        return [];
      }
      const { samples, referenceSeconds } = extractHeartRateSamples(providerDetail);
      if (!samples.length) {
        return [];
      }
      const referenceOverride = Number.isFinite(options.referenceSeconds) ? options.referenceSeconds : referenceSeconds;
      const clipRange = Array.isArray(options.clipRange) ? options.clipRange : null;
      return projectHeartRateSamples(samples, referenceOverride, clipRange);
    }

    function findNearestSample(series, target) {
      if (!series.length) {
        return null;
      }
      let left = 0;
      let right = series.length - 1;
      while (left <= right) {
        const mid = Math.floor((left + right) / 2);
        if (series[mid].time < target) {
          left = mid + 1;
        } else {
          right = mid - 1;
        }
      }
      const candidates = [];
      if (left < series.length) {
        candidates.push(series[left]);
      }
      if (left - 1 >= 0) {
        candidates.push(series[left - 1]);
      }
      if (!candidates.length) {
        return series[0];
      }
      return candidates.reduce((closest, sample) => {
        return Math.abs(sample.time - target) < Math.abs(closest.time - target) ? sample : closest;
      });
    }

    function updateReadout({ time, heartRate, segment, pace }) {
      if (!readoutEl) {
        return;
      }
      readoutEl.classList.remove("empty");
      const intensityLabel = segment
        ? (intensityPalette[segment.intensity] ?? intensityPalette.medium).label
        : "—";
      const stateLabel = segment?.isRest ? intensityLabel : pace != null ? formatPace(pace) : "—";
      const hrLabel = heartRate != null ? `${Math.round(heartRate)} bpm` : "—";
      const segmentLabel = segment?.rep_description ?? "—";
      readoutEl.innerHTML = `
        <div>
          <div class="label">Time</div>
          <div class="value">${formatTime(time)}</div>
        </div>
        <div>
          <div class="label">Heart rate</div>
          <div class="value">${hrLabel}</div>
        </div>
        <div>
          <div class="label">Distance</div>
          <div class="value">${segment?.rep_distance_meters != null ? `${segment.rep_distance_meters.toFixed(0)} m` : "—"}</div>
        </div>
        ${!segment?.isRest ? `
        <div>
          <div class="label">Pace</div>
          <div class="value">${stateLabel}</div>
        </div>
        ` : ''}
        <div>
          <div class="label">Rep</div>
          <div class="value">${segmentLabel}</div>
        </div>
      `;
    }

    function extractHeartRateSamples(providerDetail) {
      if (!providerDetail) {
        return { samples: [], referenceSeconds: null };
      }
      const bridgeSamples = providerDetail.bridgeDetail?.heartRate?.samples;
      if (Array.isArray(bridgeSamples) && bridgeSamples.length) {
        return normalizeHeartRateSamples(
          bridgeSamples,
          providerDetail.bridgeDetail?.startDate ||
            providerDetail.startDate ||
            bridgeSamples[0]?.timestamp ||
            bridgeSamples[0]?.startDate ||
            bridgeSamples[0]?.endTimestamp,
          (sample) => sample.value
        );
      }

      const directSamples = providerDetail.heartRate?.samples;
      if (Array.isArray(directSamples) && directSamples.length) {
        return normalizeHeartRateSamples(
          directSamples,
          providerDetail.startDate || directSamples[0]?.timestamp || directSamples[0]?.startDate,
          (sample) => sample.value
        );
      }

      if (Array.isArray(providerDetail.records)) {
        const referenceCandidate =
          providerDetail.startDate ||
          providerDetail.records.find((rec) => rec?.timestamp || rec?.startTime)?.timestamp ||
          providerDetail.records.find((rec) => rec?.timestamp || rec?.startTime)?.startTime;
        return normalizeHeartRateSamples(
          providerDetail.records,
          referenceCandidate,
          (sample) => sample.heartRate,
          ["timestamp", "startTime"]
        );
      }

      return { samples: [], referenceSeconds: null };
    }

    function normalizeHeartRateSamples(rawSamples, fallbackReference, valueAccessor, timeFieldOrder = ["timestamp", "startDate", "startTime", "endTimestamp"]) {
      if (!Array.isArray(rawSamples) || !rawSamples.length || typeof valueAccessor !== "function") {
        return { samples: [], referenceSeconds: parseEventTimestamp(fallbackReference) ?? null };
      }
      const normalized = rawSamples
        .map((sample) => {
          const value = valueAccessor(sample);
          if (value == null || Number.isNaN(value)) {
            return null;
          }
          const fieldName = timeFieldOrder.find((field) => sample?.[field] != null);
          const epochSeconds = parseEventTimestamp(fieldName ? sample[fieldName] : null);
          if (epochSeconds == null) {
            return null;
          }
          return { epochSeconds, value };
        })
        .filter(Boolean)
        .sort((a, b) => a.epochSeconds - b.epochSeconds);
      const referenceSeconds = parseEventTimestamp(fallbackReference) ?? normalized[0]?.epochSeconds ?? null;
      return { samples: normalized, referenceSeconds };
    }

    function projectHeartRateSamples(samples, referenceSeconds, clipRange) {
      if (!samples.length) {
        return [];
      }
      const baseline = Number.isFinite(referenceSeconds) ? referenceSeconds : samples[0].epochSeconds;
      const [clipStart, clipEnd] = Array.isArray(clipRange) ? clipRange : [null, null];
      const epsilon = 0.0001;
      return samples
        .map((sample) => ({
          time: Math.max(0, sample.epochSeconds - baseline),
          value: sample.value,
        }))
        .filter((sample) => {
          const withinStart = clipStart == null || sample.time + epsilon >= clipStart;
          const withinEnd = clipEnd == null || sample.time - epsilon <= clipEnd;
          return withinStart && withinEnd;
        });
    }

    function applyActualSegmentTimings(segments, providerDetail, referenceSeconds) {
      if (!Array.isArray(segments) || !segments.length) {
        return;
      }
      const activities = providerDetail?.workoutActivities;
      if (!Array.isArray(activities) || !activities.length) {
        return;
      }
      const baseline = Number.isFinite(referenceSeconds) ? referenceSeconds : getSessionReferenceSeconds(providerDetail);
      if (!Number.isFinite(baseline)) {
        return;
      }
      segments.forEach((segment, index) => {
        const activity = activities[index];
        if (!activity) {
          return;
        }
        const startEpoch = parseEventTimestamp(activity.start);
        const endEpoch = parseEventTimestamp(activity.end);
        if (!Number.isFinite(startEpoch) || !Number.isFinite(endEpoch)) {
          return;
        }
        const startTime = convertTimestampToElapsedSeconds(startEpoch, baseline);
        const endTime = convertTimestampToElapsedSeconds(endEpoch, baseline);
        if (!Number.isFinite(startTime) || !Number.isFinite(endTime) || endTime < startTime) {
          return;
        }
        segment.startTime = startTime;
        segment.endTime = endTime;
        segment.midTime = startTime + (endTime - startTime) / 2;
      });
    }

    function convertTimestampToElapsedSeconds(timestampSeconds, baselineSeconds) {
      if (!Number.isFinite(timestampSeconds) || !Number.isFinite(baselineSeconds)) {
        return null;
      }
      return Math.max(0, timestampSeconds - baselineSeconds);
    }

    function getSessionReferenceSeconds(providerDetail) {
      if (!providerDetail) {
        return null;
      }
      return (
        parseEventTimestamp(providerDetail.startDate) ||
        parseEventTimestamp(providerDetail.bridgeDetail?.startDate) ||
        parseEventTimestamp(providerDetail.workoutActivities?.[0]?.start) ||
        null
      );
    }

    function parseEventTimestamp(value) {
      if (value == null) {
        return null;
      }
      if (typeof value === "number" && Number.isFinite(value)) {
        return value > 1e12 ? value / 1000 : value;
      }
      if (typeof value === "string") {
        const parsed = Date.parse(value);
        if (Number.isFinite(parsed)) {
          return parsed / 1000;
        }
      }
      return null;
    }
  </script>
